const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();

const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}

function verifyLines(){const rect=doc().querySelector('.cw-line-board').getBoundingClientRect();for(const line of doc().querySelectorAll('[data-same-line]')){for(const [sel,end]of [['data-same-left','1'],['data-same-right','2']]){const p=center(doc().querySelector(`[${sel}="${line.dataset.sameLine}"]`));assert(Math.abs(Number(line.getAttribute('x'+end))-(p.x-rect.left)*1000/rect.width)<2,'Resized line x endpoint');assert(Math.abs(Number(line.getAttribute('y'+end))-(p.y-rect.top)*600/rect.height)<2,'Resized line y endpoint');}}}
function range(value){const input=doc().querySelector('[aria-label="Object size"]');Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype,'value').set.call(input,String(value));input.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));input.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));}
run.onclick=async()=>{run.disabled=true;report.textContent='';let saved;try{
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-concepts');frame.contentWindow.localStorage.setItem('little-learners-concepts',JSON.stringify({enabled:GAMES.map(g=>g.id),sorting:MODES,family:ROLES,difficulty:'medium',voice:false,effects:false,cheering:false,reach:true,motion:false}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-concepts'),'Concept card missing');assert(doc().querySelectorAll('.ll-category').length===8,'Hub needs six categories');assert([...doc().querySelectorAll('[data-category]')].slice(-3).map(n=>n.dataset.category).join(',')==='arabic,arabic-shapes,arabic-colors','Arabic learning group must stay last');doc().querySelector('.ll-art-concepts').closest('button').click();await wait(()=>doc().querySelector('.section-concepts'),'Concept menu missing');assert(doc().querySelectorAll('.cw-menu-card').length===5,'Five games missing');log('Sixth category integrated; Arabic last; five unified game cards');

 await layouts('One-pointer resize bonus');assert(starts('It fits!').disabled,'Resize bonus auto completed');range(75);await pause(30);assert(!starts('It fits!').disabled,'Resize target did not unlock');starts('It fits!').click();await pause(20);assert(progress()===7,'Resize incomplete');await next(6,7);log('Six paired-size rounds and real slider bonus; wrong/outside/cancel guarded');await back();
 status.textContent='Garden';await open('garden');await layouts('Growing garden');

 log('Flowers, trees and towers grow in multiple actions; hold-to-water and taller comparison');await back();
 status.textContent='Sorting';await open('sorting');await layouts('Factory with eight objects and four groups');

 log('All four classification rules: colors, shapes, sizes and object categories; moving/frozen belt');await back();

 for(let round=0;round<6;round++){const text=doc().querySelector('.cw-instruction h1').textContent,target=ROLES.find(r=>text.includes(r));const wrong=[...doc().querySelectorAll('[data-window]')].find(b=>b.dataset.window!==target);wrong.click();await pause(20);assert(progress()===round,'Wrong family window scored');assert(doc().querySelector('.cw-window-open'),'Shutters did not open');assert(doc().querySelector('.cw-status').textContent.includes(wrong.dataset.window),'Family introduction missing');doc().querySelector(`[data-window="${target}"]`).click();await pause(20);assert(progress()===round+1,'Family target incomplete');await next(round,7);}
 await layouts('Family portrait construction');let guard=0;while(doc().querySelector('[data-person]')&&guard++<10){const card=doc().querySelector('[data-person]'),role=card.dataset.person;if(guard===1){const wrong=[...doc().querySelectorAll('[data-portrait]')].find(b=>b.dataset.portrait!==role);await drag(card,center(wrong));assert(!doc().querySelector('.cw-filled'),'Wrong portrait scored');await pause(300);}await drag(card,center(doc().querySelector(`[data-portrait="${role}"]`)));}assert(progress()===7,'Family portrait incomplete');assert(doc().querySelector('.cw-family-gathering'),'Living room gathering missing');await next(6,7);log('All six mystery windows, spoken-text introductions and six matching portraits');await back();
 }status.textContent='Same and Different';await open('same');await layouts('Different picture search');
 for(let round=0;round<4;round++){const text=doc().querySelector('.cw-instruction h1').textContent,attr=['shape','color','size','detail'].find(a=>text.includes(a)),tokens=[...doc().querySelectorAll('[data-odd-index]')],correct=round;tokens.find(b=>Number(b.dataset.oddIndex)!==correct).click();await pause(20);assert(progress()===round,'Wrong difference scored');tokens[correct].click();await pause(20);assert(progress()===round+1,'Difference not scored '+attr);await next(round,5);}
 await layouts('Same-picture connection board');const left=()=>[...doc().querySelectorAll('[data-same-left]:not(:disabled)')];const first=left()[0],id=first.dataset.sameLeft,wrong=[...doc().querySelectorAll('[data-same-right]')].find(b=>b.dataset.sameRight!==id);await drag(first,center(wrong));assert(!doc().querySelector('[data-same-line]'),'Wrong line persisted');const badLine=doc().querySelector('.cw-retract-line'),rect=doc().querySelector('.cw-line-board').getBoundingClientRect(),badEnd=center(wrong);assert(badLine&&Math.abs(Number(badLine.getAttribute('x2'))-(badEnd.x-rect.left)*1000/rect.width)<2,'Wrong connection retracts from wrong target');await pause(600);await drag(first,center(doc().querySelector(`[data-same-right="${id}"]`)),true);assert(!doc().querySelector('[data-same-line]'),'Cancelled line persisted');let i=0;while(left().length){const a=left()[0],b=doc().querySelector(`[data-same-right="${a.dataset.sameLeft}"]`);if(i++%2){a.click();await pause(15);b.click();await pause(20);}else await drag(a,center(b));if(i===1)await layouts('Permanent connecting line after resize');}assert(doc().querySelectorAll('[data-same-line]').length===4,'Four permanent connections missing');assert(progress()===5,'Matching incomplete');await next(4,5);log('Four explicit differences and four real pointer/tap connections, resize-aligned lines');await back();
 status.textContent='Settings';doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.cw-settings'),'Settings missing');const reduced=starts('Reduced motion:');reduced.click();await pause(20);assert(doc().querySelector('.cw-reduced'),'Reduced motion not applied');reduced.click();await pause(20);const reach=starts('Reach Mode:');reach.click();await pause(20);assert(starts('Reach Mode:').getAttribute('aria-pressed')==='false','Reach toggle not applied');reach.click();await pause(20);for(const label of ['Big & Small','Tall & Short','Sorting','Family Members','Same & Different']){button(label).click();await pause(10);}await pause(20);starts('Done').click();await pause(20);assert([...doc().querySelectorAll('.cw-menu-card button')].every(b=>b.disabled),'Disabled concepts opened');doc().querySelector('[aria-label="Teacher Settings"]').click();await pause(20);button('Big & Small').click();starts('Done').click();await pause(20);await open('bears');doc().querySelector('[aria-label="Teacher Settings"]').click();await pause(20);starts('Apply & Restart').click();await pause(140);assert(progress()===0,'Restart retained progress');[...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes('Home')).click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');log('Concept toggles, empty curriculum, restart and Home');status.textContent=new URLSearchParams(location.search).has('same')?'Same-picture and settings checks passed':'All Concept World checks passed';
