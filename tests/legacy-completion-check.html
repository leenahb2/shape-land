<!doctype html><html><meta charset="utf-8"><title>Original game completion checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Original game completion checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Original games preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {SHAPES} from '/shape-land/src/shapes.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
run.onclick=async()=>{run.disabled=true;report.textContent='';const saved=new Map();try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash');const w=frame.contentWindow;for(const key of ['shape-land-settings','little-learners-letters'])saved.set(key,w.localStorage.getItem(key));w.localStorage.setItem('shape-land-settings',JSON.stringify({shapes:SHAPES.slice(0,8).map(s=>s.id),difficulty:'easy',sound:false,voice:false,reach:false,size:110}));w.localStorage.setItem('little-learners-letters',JSON.stringify({letters:['Z'],difficulty:'medium',sound:false,reach:true,arcadeAudio:{speech:false,effects:false,cheering:false}}));await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Reloaded preferences');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('[data-category=shapes]'),'Hub');doc().querySelector('[data-category=shapes]').click();await wait(()=>doc().querySelector('.adventure-grid'),'Menu');
 for(let game=0;game<3;game++){status.textContent=['Detective','Monsters','Shadows'][game];doc().querySelectorAll('.adventure-grid article')[game].querySelector('button').click();await wait(()=>doc().querySelector('.shape-tray'),'Game');let rounds=0;while(!doc().querySelector('.complete')){const old=doc().querySelector('.progress').textContent;if(!game){const text=doc().querySelector('.instruction h1').textContent,id=SHAPES.find(s=>text===`Find the ${s.name.toUpperCase()}!`).id;doc().querySelector(`[aria-label="Select ${SHAPES.find(s=>s.id===id).name}"]`).click();}else{for(const node of [...doc().querySelectorAll('.shape-tile')]){const name=node.getAttribute('aria-label').slice(7),id=SHAPES.find(s=>s.name===name).id;node.click();await pause(10);doc().querySelector(`[data-drop="${id}"]`).click();await pause(25);}}await pause(30);assert(doc().querySelector('.feedback.happy'),'Correct answer rejected');if(!game&&!rounds){doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('[role=dialog]'),'Settings');await pause(1900);assert(doc().querySelector('.progress').textContent===old,'Shapes advanced behind Teacher Settings');doc().querySelector('[aria-label="Close settings"]').click();log('Original Shapes celebration waits while Teacher Settings is open');}rounds++;await wait(()=>doc().querySelector('.complete')||doc().querySelector('.progress').textContent!==old,'Round did not advance',6000);await pause(50);}
 assert(rounds===(game?2:10),'Original round progression');for(const value of sizes){if(![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value;resize();await pause(90);assert(doc().documentElement.scrollWidth<=w.innerWidth&&doc().documentElement.scrollHeight<=w.innerHeight,'Completion scrolling '+value);assert(doc().querySelector('.site-credit').textContent==='Made with love by Ms. Leena','Completion credit');for(const b of doc().querySelectorAll('.completion-buttons button,.site-bar button')){const r=b.getBoundingClientRect();assert(r.x>=0&&r.right<=w.innerWidth&&r.y>=0&&r.bottom<=w.innerHeight,'Completion control outside '+value);}}select.value='1920,1080';resize();button('More adventures →').click();await wait(()=>doc().querySelector('.adventure-grid'),'Game menu');log(['Detective','Monsters','Shadows'][game]+' full completion, seven completion viewports and return navigation');}
 button('⌂ Home').click();await wait(()=>doc().querySelector('[data-category=letters]'),'Hub');doc().querySelector('[data-category=letters]').click();await wait(()=>doc().querySelector('.adventure-grid'),'Letters menu');doc().querySelector('[aria-label="Play Letter Detective"]').click();await wait(()=>doc().querySelector('.ll-answer'),'Letter game');for(let round=0;round<10;round++){const old=doc().querySelector('.ll-game-progress').textContent,phrase=doc().querySelector('.ll-prompt h1').textContent,letter=phrase.match(/[A-Z]/g).at(-1);doc().querySelector(`[aria-label="Letter ${letter}"]`).click();await pause(30);assert(doc().querySelector('.ll-answer.correct'),'Letter correct answer rejected');await wait(()=>doc().querySelector('.ll-completion')||doc().querySelector('.ll-game-progress').textContent!==old,'Letter did not advance',6000);await pause(50);}assert(doc().querySelector('.ll-completion'),'Letter completion');for(const value of sizes){select.value=value;resize();await pause(70);assert(doc().documentElement.scrollWidth<=w.innerWidth&&doc().documentElement.scrollHeight<=w.innerHeight,'Letter completion scrolling '+value);}log('Letter Detective ten full rounds and seven completion viewports');status.textContent='All legacy completion checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.stack;}finally{for(const[k,v]of saved){if(v===null)frame.contentWindow.localStorage.removeItem(k);else frame.contentWindow.localStorage.setItem(k,v);}run.disabled=false;}};</script></html>
