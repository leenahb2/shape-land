<!doctype html><html><meta charset="utf-8"><title>Numbers menu and settings checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Numbers menu and settings checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Numbers preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}

const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-numbers');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-numbers'),'Numbers missing');doc().querySelector('.ll-art-numbers').closest('button').click();await wait(()=>doc().querySelector('.section-numbers'),'Menu missing');for(const value of sizes){if(![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value;resize();await pause(120);const w=frame.contentWindow.innerWidth;assert(doc().documentElement.scrollWidth<=w,'Menu overflow '+value);const grid=doc().querySelector('.section-numbers .adventure-grid');if(w>=768)assert(frame.contentWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length===3,'Not three columns '+value);for(const card of grid.children){const r=card.getBoundingClientRect();for(const child of card.querySelectorAll('h2,p,button,svg,.nu-tower-note')){const c=child.getBoundingClientRect();assert(c.left>=r.left-.5&&c.right<=r.right+.5&&c.top>=r.top-.5&&c.bottom<=r.bottom+.5,'Menu content outside card '+value+' '+child.tagName);}}}log('Numbers menu: seven viewports, unified three-column desktop grid, illustrations and content within cards');select.value='1920,1080';resize();button('⚙ Teacher Settings').click();await wait(()=>doc().querySelector('.nu-settings'),'Settings missing');for(const [name,count]of [['1–5 · KG1',5],['1–10 · KG2',10],['0–10 · Include zero',11]]){button(name).click();await pause(25);assert(doc().querySelectorAll('.nu-number-picker [aria-pressed=true]').length===count,'Range failed '+name);}button('Speech: On')?.click();await pause(10);button('Speech: Off')?.click();await pause(20);assert(!button('♫ Replay Voice'),'Menu should not replay an active game');for(const value of sizes){select.value=value;resize();await pause(100);const r=doc().querySelector('.nu-settings').getBoundingClientRect(),w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(r.left>=0&&r.top>=0&&r.right<=w+.5&&r.bottom<=h+.5,'Settings clipping '+value);assert(doc().documentElement.scrollWidth<=w,'Settings horizontal overflow '+value);}button('Done ✓').click();await pause(30);const savedSettings=JSON.parse(frame.contentWindow.localStorage.getItem('little-learners-numbers'));assert(savedSettings.numbers.length===11&&savedSettings.numbers.includes(0),'Numbers preferences not persisted');log('KG1, KG2, zero range, speech setting, local persistence, seven dialog bounds');button('⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');status.textContent='All Numbers menu checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.message+'\n';console.error(e)}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-numbers');else frame.contentWindow.localStorage.setItem('little-learners-numbers',saved);}run.disabled=false}};
</script></html>
