<!doctype html><html><meta charset="utf-8"><title>Concept resize interactions</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Concept resize interactions</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Concept preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {GAMES,ROLES,MODES,rounds,preferences} from '/shape-land/src/concepts/model.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
const starts=t=>[...doc().querySelectorAll('button')].find(b=>b.textContent.trim().startsWith(t));
const progress=()=>Number(doc().querySelector('[aria-label="Concept learning progress"]').getAttribute('aria-valuenow'));
async function open(id){doc().querySelector('.cw-menu-'+id).closest('article').querySelector('button').click();await wait(()=>doc().querySelector('.cw-game'),'Game missing');await pause(140);}
async function back(){[...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes('Games')).click();await wait(()=>doc().querySelector('.section-concepts'),'Menu missing');}
async function next(round,total){await wait(()=>round===total-1?doc().querySelector('.cw-finale'):!doc().querySelector('.cw-reward'),'Round failed to advance',6500);await pause(120);}
async function layouts(label){for(const size of sizes){if(![...select.options].some(o=>o.value===size))select.add(new Option(size,size));select.value=size;resize();await pause(100);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w,label+' horizontal scroll '+size);assert(doc().documentElement.scrollHeight<=h,label+' gameplay scroll '+size);for(const node of doc().querySelectorAll('.site-bar button,.cw-progress button,.cw-stage button,.cw-size-control input')){const r=node.getBoundingClientRect();assert(r.width>0&&r.height>0&&r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+size+' '+(node.ariaLabel||node.textContent)+' '+JSON.stringify({x:r.x,y:r.y,w:r.width,h:r.height}));assert(Math.min(r.width,r.height)>=29,label+' tiny control '+size+' '+(node.ariaLabel||node.textContent));}if(doc().querySelector('.cw-lines'))verifyLines();}select.value='1920,1080';resize();await pause(80);log(label+' seven viewports: visible controls, no gameplay scrolling and mapped lines');}
function verifyLines(){const rect=doc().querySelector('.cw-line-board').getBoundingClientRect();for(const line of doc().querySelectorAll('[data-same-line]')){for(const [sel,end]of [['data-same-left','1'],['data-same-right','2']]){const p=center(doc().querySelector(`[${sel}="${line.dataset.sameLine}"]`));assert(Math.abs(Number(line.getAttribute('x'+end))-(p.x-rect.left)*1000/rect.width)<2,'Resized line x endpoint');assert(Math.abs(Number(line.getAttribute('y'+end))-(p.y-rect.top)*600/rect.height)<2,'Resized line y endpoint');}}}
function range(value){const input=doc().querySelector('[aria-label="Object size"]');Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype,'value').set.call(input,String(value));input.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));input.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));}
run.onclick=async()=>{run.disabled=true;report.textContent='';let saved;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-concepts');frame.contentWindow.localStorage.setItem('little-learners-concepts',JSON.stringify({enabled:GAMES.map(g=>g.id),sorting:MODES,family:ROLES,difficulty:'medium',voice:false,effects:false,cheering:false,reach:true,motion:false}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-concepts'),'Hub missing');doc().querySelector('.ll-art-concepts').closest('button').click();await wait(()=>doc().querySelector('.section-concepts'),'Menu missing');
for(const size of sizes){status.textContent='Testing '+size;if(![...select.options].some(o=>o.value===size))select.add(new Option(size,size));select.value=size;resize();await pause(100);if(Number(size.split(',')[0])>=1024)assert(frame.contentWindow.getComputedStyle(doc().querySelector('.adventure-grid')).gridTemplateColumns.split(' ').length===3,'Desktop menu columns');await open('bears');await drag(doc().querySelector('[data-bear-object="big"]'),center(doc().querySelector('[data-bear="big"]')));assert(doc().querySelectorAll('.cw-filled').length===1,'Resized bear drop failed '+size);await back();await open('garden');const target=doc().querySelector('.cw-instruction h1').textContent.includes('right')?1:0,plant=doc().querySelector(`[data-plant="${target}"]`),can=doc().querySelector('.cw-can'),id=++pointer;emit(can,'pointerdown',center(can),id);emit(can,'pointermove',center(plant),id);await pause(400);emit(can,'pointercancel',center(plant),id);await pause(20);const height=Number(plant.getAttribute('aria-label').match(/height (\d+)/)[1]);assert(height>10&&height<80,'Resized sustained watering failed '+size);await pause(230);assert(Number(plant.getAttribute('aria-label').match(/height (\d+)/)[1])===height,'Cancelled watering continued');await back();await open('sorting');const toy=doc().querySelector('[data-sort-object]'),count=doc().querySelectorAll('[data-sort-object]').length;await drag(toy,center(doc().querySelector(`[data-sort-bin="${toy.dataset.group}"]`)));assert(doc().querySelectorAll('[data-sort-object]').length===count-1,'Resized sorting failed '+size);await back();await open('family');const text=doc().querySelector('.cw-instruction h1').textContent,targetRole=ROLES.find(r=>text.includes(r));doc().querySelector(`[data-window="${targetRole}"]`).click();await pause(30);assert(progress()===1&&doc().querySelector('.cw-window-open'),'Resized window reveal failed '+size);await back();await open('same');doc().querySelector('[data-odd-index="0"]').click();await pause(20);assert(progress()===1,'Resized comparison failed '+size);await back();log(size+': bear/factory mapped drops, sustained/cancelled watering, window opening and difference discovery');}
status.textContent='All Concept resize interactions passed';}catch(error){status.textContent='FAILED';report.textContent+='FAIL: '+(error.stack||error);console.error(error);}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-concepts');else frame.contentWindow.localStorage.setItem('little-learners-concepts',saved);}run.disabled=false;}};
</script></html>
