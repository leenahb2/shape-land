<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shape Land layout check</title><style>body{margin:0;font:14px system-ui;background:#ddd}nav{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{padding:8px}#frame-wrap{margin:10px;position:relative}iframe{border:0;transform-origin:top left;background:white}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style></head><body><nav><label>Test viewport <select id="size"><option value="390,844">Phone 390 × 844</option><option value="320,568">Small phone 320 × 568</option><option value="844,390">Phone landscape 844 × 390</option><option value="768,1024">iPad portrait 768 × 1024</option><option value="1024,768">iPad landscape 1024 × 768</option><option value="1366,768">Laptop 1366 × 768</option><option value="1920,1080">Smartboard 1920 × 1080</option></select></label><button id="check">Check layout</button></nav><div id="frame-wrap"><iframe title="Shape Land preview" src="/"></iframe></div><pre id="report"></pre><script>
const frame=document.querySelector('iframe'),sizes=document.querySelector('select'),wrap=document.querySelector('#frame-wrap');
function resize(){const [w,h]=sizes.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-180)/h,1);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';}
sizes.onchange=resize;window.onresize=resize;resize();
document.querySelector('#check').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight,rect=e=>e.getBoundingClientRect();const controls=[...d.querySelectorAll('.shape-tile,.destination,.replay,.instruction,.game-top,.splash-enter,.splash-title,.splash-signature')];const outside=controls.filter(e=>{const r=rect(e);return r.left<-.5||r.right>w+.5||r.top<-.5||r.bottom>h+.5}).map(e=>e.className);const items=[...d.querySelectorAll('.shape-tile,.destination')];const overlaps=[];for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=rect(items[i]),b=rect(items[j]);if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>1&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>1)overlaps.push([items[i].ariaLabel,items[j].ariaLabel]);}const instruction=d.querySelector('.instruction'),answerOverlap=instruction?items.some(e=>rect(e).top<rect(instruction).bottom-1):false;document.querySelector('#report').textContent=JSON.stringify({viewport:[w,h],horizontalOverflow:d.documentElement.scrollWidth>w,verticalOverflow:d.querySelector('.game')?d.documentElement.scrollHeight>h:false,controlsOutsideViewport:outside,overlappingShapes:overlaps,answersOverlapInstructions:answerOverlap,targets:items.length,cell:items[0]?Math.round(rect(items[0]).width):null},null,2);};
</script></body></html>
