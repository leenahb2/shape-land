<!doctype html><html><meta charset="utf-8"><title>Play area reference audit</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Play area reference audit</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Design preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();

const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];

function credit(){const nodes=doc().querySelectorAll('.site-credit');assert(nodes.length===1,'Credit must have one mounted copy');assert(nodes[0].textContent==='Made with love by Ms. Leena','Credit spelling');const r=nodes[0].getBoundingClientRect();assert(r.top>=0&&r.top<15&&r.bottom<=45,'Credit not at top');assert(frame.contentWindow.getComputedStyle(nodes[0]).zIndex==='200','Credit hidden behind overlay');}
async function atSizes(label,kind){for(const size of sizes){if(![...select.options].some(o=>o.value===size))select.add(new Option(size,size));select.value=size;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;credit();assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+size);if(kind==='game')assert(doc().documentElement.scrollHeight<=h,label+' game scrolling '+size);const buttons=[...doc().querySelectorAll('.site-bar button')].filter(b=>b.getClientRects().length>0);for(const b of buttons){const r=b.getBoundingClientRect();assert(r.left>=-.5&&r.right<=w+.5&&r.top>=0&&r.bottom<=h,label+' nav outside '+size);assert(r.height>=40&&r.width>=40,label+' nav target small '+size);}const title=doc().querySelector('.site-bar-title');if(title){const r=title.getBoundingClientRect();for(const b of buttons){const t=b.getBoundingClientRect();assert(!(r.left<t.right-1&&r.right>t.left+1&&r.top<t.bottom-1&&r.bottom>t.top+1),label+' title overlaps navigation '+size);}}
if(kind==='menu'){const cards=[...doc().querySelectorAll('.adventure-grid>article')],rects=cards.map(c=>c.getBoundingClientRect());for(const [i,r] of rects.entries()){assert(Math.abs(r.width-r.height)<3,label+' non-square card '+size+' '+i+' '+r.width+'x'+r.height);assert(r.left>=0&&r.right<=w+.5,label+' card outside '+size);const b=cards[i].querySelector('button'),t=cards[i].querySelector('h2').getBoundingClientRect(),br=b.getBoundingClientRect();assert(br.top>=t.bottom-1,label+' title/button overlap '+size);assert(br.height>=44,label+' small card button '+size);}if(w>=1024)assert(frame.contentWindow.getComputedStyle(menu()).gridTemplateColumns.split(' ').length===3,label+' desktop grid');if(w===820)assert(frame.contentWindow.getComputedStyle(menu()).gridTemplateColumns.split(' ').length===2,label+' portrait grid');}
if(kind==='settings'){const dialog=doc().querySelector('[role="dialog"]'),r=dialog.getBoundingClientRect();assert(r.top>=30&&r.left>=0&&r.right<=w&&r.bottom<=h,label+' modal outside '+size);const close=dialog.querySelector('button'),cr=close.getBoundingClientRect();assert(cr.top>=r.top&&cr.bottom<=h,label+' close hidden '+size);dialog.scrollTop=dialog.scrollHeight;await pause(15);const actions=dialog.querySelector('.nu-setting-actions,.co-setting-actions,.cw-setting-actions,.ar-settings-actions,.modal-foot,.ui-settings-actions');for(const b of actions.querySelectorAll('button')){const br=b.getBoundingClientRect();assert(br.top>=r.top&&br.bottom<=h&&br.right<=w&&br.left>=0,label+' modal action hidden '+size+' '+b.textContent);}dialog.scrollTop=0;assert(dialog.querySelectorAll('.ui-segments>button').length===2,label+' difficulty segments missing');}}
select.value='1920,1080';resize();await pause(80);if(kind==='game'){const area=doc().querySelector('[data-play-area]');if(area){const r=area.getBoundingClientRect();assert(Math.abs(r.width-742)<1&&Math.abs(r.height-306)<1,label+' shared reference dimensions');for(const el of area.querySelectorAll('button,[role=button],input,canvas,svg[data-trace]')){if(!el.getClientRects().length)continue;const b=el.getBoundingClientRect();assert(!(b.width&&b.height&&(b.left<r.left-1||b.right>r.right+1||b.top<r.top-1||b.bottom>r.bottom+1)),label+' interaction outside reference: '+el.className);assert(!b.width||!b.height||Math.min(b.width,b.height)>=39,label+' tiny target: '+el.className);}}const rect=s=>{const n=doc().querySelector(s);if(!n)return null;const r=n.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};log(label+' '+JSON.stringify({zone:rect('.play-zone'),matching:rect('.matching-area'),tray:rect('.shape-tray'),main:rect('.ll-play,.arc-main,.move-main,.nu-main,.co-main,.cw-main,.ar-game-main')}));}log(label+' seven viewport checks');}
run.onclick=async()=>{run.disabled=true;report.textContent='';try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');credit();log('Splash: single exact top credit');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub missing');credit();assert(doc().querySelectorAll('.ll-category').length===8,'Six categories missing');
for(const id of cats){status.textContent='Auditing '+id;doc().querySelector('.ll-art-'+id).closest('button').click();await wait(()=>menu(),'Menu missing '+id);await atSizes(id+' menu','menu');const settingsButton=()=>doc().querySelector('.site-bar button[aria-label="Teacher Settings"],.site-bar button[aria-label="إعدادات المعلّمة"]');settingsButton().click();await wait(()=>doc().querySelector('[role="dialog"]'),'Settings missing '+id);const dialog=doc().querySelector('[role="dialog"]'),selected=()=>[...dialog.querySelectorAll('[aria-pressed=true]')].map(n=>n.textContent.trim()).sort().join('|'),before=selected();await atSizes(id+' settings','settings');assert(selected()===before,'Viewport audit reset preferences '+id);const current=dialog.querySelector('.ui-segments [aria-pressed=true]');current.click();await pause(20);assert(selected()===before,'Same difficulty changed preferences '+id);if(id==='arabic')assert(!/التعليق الصوتي|المؤثرات الصوتية|أصوات الاحتفال|إعادة سماع/.test(dialog.textContent),'Arabic audio restored');const close=dialog.querySelector('button[aria-label*="Close"],button[aria-label="إغلاق الإعدادات"],.close');close.click();await wait(()=>!doc().querySelector('[role="dialog"]'),'Settings close failed');
const count=menu().querySelectorAll(':scope>article').length;for(let j=0;j<count;j++){const card=menu().querySelectorAll(':scope>article')[j],start=card.querySelector('button');if(start.disabled){log(id+': unavailable game remains guarded');continue;}const title=card.querySelector('h2').textContent;start.click();await wait(()=>!menu(),'Game did not open '+title);await pause(120);await atSizes(title,'game');const game=doc().querySelector('.game,.ll-game-page,.move-game,.arcade,.nu-game,.co-game,.cw-game,.ar-game');assert(game,'Game root missing '+title);if(id!=='shapes'){const initialReach=doc().querySelector('[data-play-area]').classList.contains('game-play-area-reach');for(const reach of [false,true]){settingsButton().click();await wait(()=>doc().querySelector('[role=dialog]'),'Reach settings');const toggle=[...doc().querySelectorAll('[role=dialog] button')].find(b=>/Reach Mode|وضع الوصول/.test(b.textContent));assert(toggle,'Reach toggle missing');if((toggle.getAttribute('aria-pressed')==='true')!==reach)toggle.click();doc().querySelector('[role=dialog] button[aria-label*=Close],[role=dialog] button[aria-label="إغلاق الإعدادات"], [role=dialog] .close').click();await pause(90);const r=doc().querySelector('[data-play-area]').getBoundingClientRect();assert(Math.abs(r.y-(reach?715.6015625:569.46875))<1,title+' vertical reference mismatch');assert(Math.abs(r.width-742)<1&&Math.abs(r.height-306)<1,title+' Reach changed area size');}if(!initialReach){settingsButton().click();await wait(()=>doc().querySelector('[role=dialog]'),'Restore reach');[...doc().querySelectorAll('[role=dialog] button')].find(b=>/Reach Mode|وضع الوصول/.test(b.textContent)).click();doc().querySelector('[role=dialog] button[aria-label*=Close],[role=dialog] button[aria-label="إغلاق الإعدادات"], [role=dialog] .close').click();}log(title+' reference matches with Reach off/on');}settingsButton().click();await wait(()=>doc().querySelector('[role="dialog"]'),'In-game settings missing');credit();doc().querySelector('[role="dialog"] button[aria-label*="Close"],[role="dialog"] button[aria-label="إغلاق الإعدادات"],[role="dialog"] .close').click();await wait(()=>!doc().querySelector('[role="dialog"]'),'In-game close failed');assert(!menu(),'Closing settings unexpectedly left game');navButton(id==='arabic'?'الألعاب':'Games').click();await wait(()=>menu(),'Back missing '+title);}
navButton(id==='arabic'?'الرئيسية':'Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed '+id);}
doc().querySelector('.ll-art-letters').closest('button').click();await wait(()=>menu(),'English missing');doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.ll-letter-picker'),'Letter settings missing');const a=doc().querySelector('.ll-letter-picker button');const hadA=a.getAttribute('aria-pressed')==='true';if(!hadA){a.click();await pause(20);}button('Done ✓').click();await wait(()=>!doc().querySelector('[role="dialog"]'),'Close failed');const tracing=[...menu().querySelectorAll('article')].find(c=>c.querySelector('h2').textContent==='Magic Letter Tracing');tracing.querySelector('button').click();await wait(()=>!menu(),'Tracing missing');await pause(100);await atSizes('Magic Letter Tracing','game');doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.ll-letter-picker'),'Restore settings missing');if(!hadA){doc().querySelector('.ll-letter-picker button').click();await pause(20);}button('Done ✓').click();await pause(40);navButton('Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');doc().querySelector('.ll-art-colors').closest('button').click();await wait(()=>menu(),'Colors missing');doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.co-color-picker'),'Colors settings missing');const beforeColors=[...doc().querySelectorAll('.co-color-picker [aria-pressed=true]')].map(n=>n.ariaLabel).join('|');button('Default Colors').click();await pause(20);assert(doc().querySelector('.ui-preset-confirm'),'Defaults confirmation missing');button('Cancel').click();await pause(20);assert([...doc().querySelectorAll('.co-color-picker [aria-pressed=true]')].map(n=>n.ariaLabel).join('|')===beforeColors,'Cancelled defaults reset selections');doc().querySelector('[aria-label="Close color settings"]').click();await pause(20);navButton('Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Final Home failed');log('Tracing curriculum restored; default-color reset requires confirmation; Cancel preserves choices');status.textContent='All final design checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+(e.stack||e);console.error(e);}finally{run.disabled=false;}};
</script></html>
