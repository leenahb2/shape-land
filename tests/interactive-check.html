<!doctype html><html lang="en"><head><meta charset="utf-8"><title>English physical interaction checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:10px}#wrap{margin:12px}iframe{border:0;transform-origin:top left;background:#fffaf1}pre{padding:12px;font-size:12px;white-space:pre-wrap}</style></head><body><nav><button id="run">Run physical learning checks</button><label>Viewport <select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad 1024 × 768</option><option value="768,1024">iPad 768 × 1024</option><option value="844,390">Short landscape 844 × 390</option><option value="390,844">Phone 390 × 844</option></select></label><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Physical learning preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {STROKES} from '/shape-land/src/letters/interactive/strokePaths.js';
import {PHONICS} from '/shape-land/src/letters/interactive/phonics.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms)),doc=()=>frame.contentDocument;
const assert=(value,message)=>{if(!value)throw new Error(message)},log=message=>report.textContent+='PASS: '+message+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
function button(text,scope=doc()){return [...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text)}
async function wait(test,message,timeout=6500){const end=Date.now()+timeout;while(Date.now()<end){if(test())return;await pause(35)}throw new Error(message)}
async function settings(letters){button('⚙ Teacher Settings').click();await wait(()=>doc().querySelector('.ll-letter-picker'),'Settings missing');button('Clear All').click();await pause(20);for(const l of letters){[...doc().querySelectorAll('.ll-letter-picker button')].find(b=>b.textContent===l).click();await pause(5)}const selects=doc().querySelectorAll('.ll-settings select');selects[0].value='medium';selects[0].dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));selects[1].value='mixed';selects[1].dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));button('Reach Mode: Off')?.click();button('Sound & voice: On')?.click();for(const name of ['Speech','Sound effects','Celebrations']){button(name+': On')?.click();await pause(5)}button('Done ✓').click();await pause(40)}
async function open(title){const card=[...doc().querySelectorAll('.ll-game-card')].find(c=>c.querySelector('h2').textContent===title);assert(card,'Missing '+title);assert(!card.querySelector('button').disabled,'Disabled '+title);card.querySelector('button').click();await wait(()=>doc().querySelector('.move-game,.arcade'),'Game did not open');await pause(150)}
async function back(){button('← Games').click();await wait(()=>doc().querySelector('.ll-game-cards'),'Back failed')}
async function restartCheck(label){button('⚙ Teacher Settings').click();await wait(()=>button('Restart Game'),'Restart missing');button('Restart Game').click();await pause(100);assert(progress()===0,label+' restart retained score');log(label+' teacher restart')}
function center(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
let pointer=20;
function emit(el,type,p,id){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:true,button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1,clientX:p.x,clientY:p.y}))}
async function drag(el,to,{cancel=false}={}){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let step=1;step<=12;step++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*step/12,y:from.y+(to.y-from.y)*step/12},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(30)}
function progress(){return Number(doc().querySelector('[aria-label="Learning progress"],[aria-label="Arcade progress"]').getAttribute('aria-valuenow'))}
async function layouts(label){for(const value of ['1920,1080','1024,768','768,1024','844,390','390,844']){select.value=value;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w&&doc().documentElement.scrollHeight<=h,label+' scrolling at '+value);for(const el of doc().querySelectorAll('.move-letter-token,.move-treasure-box,.move-picture-token,.move-letter-house,.move-match-node,.move-tracing-svg,.move-trace-controls button,.arc-balloon-button,.arc-nav button,.move-replay')){const r=el.getBoundingClientRect();assert(r.left>=-.5&&r.right<=w+.5&&r.top>=-.5&&r.bottom<=h+.5,label+' outside viewport '+value+': '+el.ariaLabel);if(w===1920&&el.matches('.move-letter-token,.move-match-node,.move-picture-token'))assert(Math.min(r.width,r.height)>=100,label+' smartboard target too small')}}for(const line of doc().querySelectorAll('.move-permanent-line')){const letter=line.dataset.pair,board=doc().querySelector('.move-matching-board').getBoundingClientRect();for(const [side,key] of [['Big ','1'],['Small ','2']]){const node=doc().querySelector('[aria-label="'+side+(side==='Big '?letter:letter.toLowerCase())+'"]'),p=center(node);assert(Math.abs(Number(line.getAttribute('x'+key))-(p.x-board.left)*1000/board.width)<2&&Math.abs(Number(line.getAttribute('y'+key))-(p.y-board.top)*1000/board.height)<2,'Connection endpoint lost after resizing')}}select.value='1920,1080';resize();await pause(60);log(label+' bounds at five viewports')}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'No splash');saved=frame.contentWindow.localStorage.getItem('little-learners-letters');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-letters'),'No hub');doc().querySelector('.ll-art-letters').closest('button').click();await wait(()=>doc().querySelector('.ll-game-cards'),'No menu');assert(![...doc().querySelectorAll('h2')].some(h=>h.textContent.includes('Train')),'Train still exists');await settings(['A','B','C','S','T']);log('Train removed; selected A B C S T, Medium, mixed case, Reach Mode');
 status.textContent='Testing Letter Collector';await open('Letter Collector');await restartCheck('Collector');await layouts('Collector');
 for(let round=0;round<5;round++){
  const letter=doc().querySelector('.move-heading em').textContent[0];const box=doc().querySelector('.move-treasure-box'),tokens=()=>[...doc().querySelectorAll('.move-letter-token:not(.move-drag-ghost)')],matches=()=>tokens().filter(b=>b.textContent.trim().toUpperCase()===letter);
  if(!round){const wrong=tokens().find(b=>b.textContent.trim().toUpperCase()!==letter);await drag(wrong,center(box));assert(doc().querySelector('.move-box-count').textContent==='0 / 4','Wrong token counted');const valid=matches()[0];await drag(valid,{x:5,y:5});assert(doc().querySelector('.move-box-count').textContent==='0 / 4','Outside drop counted');await drag(valid,center(box),{cancel:true});assert(doc().querySelector('.move-box-count').textContent==='0 / 4','Cancelled drop counted');assert(!doc().querySelector('.move-drag-ghost'),'Cancelled drag left ghost');log('Collector rejects wrong/outside/cancelled drops')}
  const first=matches()[0];first.click();await pause(10);box.click();await pause(20);assert(doc().querySelector('.move-box-count').textContent==='1 / 4','Tap alternative failed');
  while(matches().length){await drag(matches()[0],center(box))}
  assert(progress()===round+1,'Collector did not complete all matching tokens');if(round<4)await wait(()=>!doc().querySelector('.move-reward'),'Collector next failed');else await wait(()=>doc().querySelector('.move-finale'),'Collector finish failed');
 }log('Collector full 5 rounds, drag + tap, exact counts and completion');await back();
 status.textContent='Testing connect-the-letters';await open('Big & Small Matching');await restartCheck('Matching');await layouts('Matching');
 for(let round=0;round<4;round++){
  const upper=()=>[...doc().querySelectorAll('[aria-label^="Big "]')].filter(b=>!b.disabled),lower=l=>doc().querySelector('[aria-label="Small '+l.toLowerCase()+'"]');
  if(!round){const first=upper()[0],letter=first.textContent.trim(),wrong=[...doc().querySelectorAll('[aria-label^="Small "]')].find(b=>b.ariaLabel!=='Small '+letter.toLowerCase());await drag(first,center(wrong));assert(!doc().querySelector('.move-permanent-line'),'Wrong connection kept');await pause(500);await drag(first,center(lower(letter)),{cancel:true});assert(!doc().querySelector('.move-permanent-line'),'Cancelled connection counted');log('Matching rejects wrong/cancelled connections')}
  let i=0;while(upper().length){const big=upper()[0],letter=big.textContent.trim();if(i++%2){big.click();await pause(10);lower(letter).click();await pause(20)}else await drag(big,center(lower(letter)))}
  assert(doc().querySelectorAll('.move-permanent-line').length===4,'Permanent line count mismatch');if(!round)await layouts('Connected line resize');assert(progress()===round+1,'Matching round progress wrong');if(round<3)await wait(()=>!doc().querySelector('.move-reward'),'Matching next failed');else await wait(()=>doc().querySelector('.move-finale'),'Matching finish failed');
 }log('Matching full 4 sets, real pointer lines, tap alternative and completion');await back();
 status.textContent='Testing picture sorting';await open('Letter & Picture Sorting');await restartCheck('Picture sorting');await layouts('Picture sorting');
 for(let round=0;round<5;round++){
  const letter=doc().querySelector('.move-heading h1').textContent.match(/Help ([A-Z])/)[1],valid=PHONICS[letter].map(p=>p.word),house=doc().querySelector('.move-letter-house'),pictures=()=>[...doc().querySelectorAll('.move-picture-token:not(.move-drag-ghost)')];
  const correct=()=>pictures().filter(b=>valid.includes(b.ariaLabel.replace('Picture ','')));
  if(!round){const wrong=pictures().find(b=>!valid.includes(b.ariaLabel.replace('Picture ','')));await drag(wrong,center(house));assert(doc().querySelector('.move-house-count').textContent==='0 / 3','Wrong picture sorted');await drag(correct()[0],center(house),{cancel:true});assert(doc().querySelector('.move-house-count').textContent==='0 / 3','Cancelled picture sorted');log('Picture sorting rejects wrong and cancelled drops')}
  const first=correct()[0];first.click();await pause(10);house.click();await pause(15);while(correct().length)await drag(correct()[0],center(house));assert(progress()===round+1,'Sorting round count wrong');if(round<4)await wait(()=>!doc().querySelector('.move-reward'),'Sorting next failed');else await wait(()=>doc().querySelector('.move-finale'),'Sorting finish failed');
 }log('Picture sorting full 5 rounds, illustrated objects and completion');await back();
 status.textContent='Testing genuine stroke tracing';await open('Magic Letter Tracing');await restartCheck('Tracing');await layouts('Tracing');
 for(let round=0;round<5;round++){
  const letter=doc().querySelector('.move-heading em').textContent,svg=doc().querySelector('.move-tracing-svg'),paths=STROKES[letter];const screen=p=>{const point=svg.createSVGPoint();point.x=p.x;point.y=p.y;return point.matrixTransform(svg.getScreenCTM())};
  if(!round){let id=++pointer;emit(svg,'pointerdown',screen(paths[0].end),id);emit(svg,'pointerup',screen(paths[0].end),id);assert(button('Next Letter →').disabled,'Endpoint tap completed letter');id=++pointer;emit(svg,'pointerdown',screen(paths[0].start),id);emit(svg,'pointermove',screen(paths[0].end),id);emit(svg,'pointerup',screen(paths[0].end),id);await pause(30);assert(button('Next Letter →').disabled,'Teleport completed letter');button('↻ Reset Letter').click();button('✦ Show Me').click();await pause(150);assert(Number(doc().querySelector('[aria-label="Completed tracing strokes"]').getAttribute('aria-valuenow'))===0,'Demo completed strokes');button('↻ Reset Letter').click();const cancelledId=++pointer;emit(svg,'pointerdown',screen(paths[0].start),cancelledId);emit(svg,'pointermove',screen(paths[0].points[5]),cancelledId);emit(svg,'pointercancel',screen(paths[0].points[5]),cancelledId);assert(button('Next Letter →').disabled,'Cancelled trace completed letter');button('↻ Reset Letter').click();log('Tracing rejects endpoint taps/teleports; demonstration and cancellation award no completion')}
  for(const path of paths){const id=++pointer;emit(svg,'pointerdown',screen(path.start),id);for(let i=1;i<path.points.length;i+=3){emit(svg,'pointermove',screen(path.points[i]),id);if(i%30===1)await pause(1)}emit(svg,'pointermove',screen(path.end),id);emit(svg,'pointerup',screen(path.end),id);await pause(20)}
  assert(!button('Next Letter →').disabled,'Real strokes failed for '+letter);assert(Number(doc().querySelector('[aria-label="Completed tracing strokes"]').getAttribute('aria-valuenow'))===paths.length,'Stroke count wrong '+letter);button('Next Letter →').click();await pause(60);
 }assert(doc().querySelector('.move-finale'),'Tracing completion missing');log('Tracing completed all ordered strokes for A B C S T, with pen lifts and Next');await back();
 status.textContent='Testing flying hitboxes';await open('Flying Alphabet Balloons');await layouts('Moving balloons');const balloon=doc().querySelector('.arc-balloon-button'),initial=center(balloon);await pause(1600);assert(Math.hypot(center(balloon).x-initial.x,center(balloon).y-initial.y)>5,'Balloons are stationary');button('Ⅱ Pause Motion').click();await pause(50);const frozen=center(balloon);await pause(300);assert(Math.hypot(center(balloon).x-frozen.x,center(balloon).y-frozen.y)<.5,'Pause failed');button('▶ Resume Motion').click();await pause(400);const id=++pointer;emit(balloon,'pointerdown',center(balloon),id);const held=center(balloon);await pause(300);assert(Math.hypot(center(balloon).x-held.x,center(balloon).y-held.y)<.5,'Touch did not freeze balloon');emit(balloon,'pointercancel',held,id);assert(progress()===0,'Cancelled balloon touch popped it');log('Balloon hitboxes travel, stay in bounds, pause/resume, freeze on touch, and cancel safely');await back();
 await settings(['Z']);const tracingCard=[...doc().querySelectorAll('.ll-game-card')].find(c=>c.querySelector('h2').textContent==='Magic Letter Tracing');assert(tracingCard.querySelector('button').disabled,'Unsupported tracing letter appears playable');await open('Big & Small Matching');assert(doc().querySelectorAll('[aria-label^="Big "]').length===1,'Single-letter matching not supported');await back();await settings(['X']);await open('Letter & Picture Sorting');assert(doc().querySelector('.move-heading h1').textContent.includes('ending'),'X silently uses wrong initial phonics');await back();log('Z stays playable elsewhere, one-pair matching works, X final-sound question is explicit');
 button('⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');status.textContent='All physical learning checks passed';log('Home and retained hub navigation');
 }catch(error){status.textContent='FAILED';report.textContent+='FAIL: '+error.message+'\n';console.error(error)}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-letters');else frame.contentWindow.localStorage.setItem('little-learners-letters',saved)}run.disabled=false}};
</script></body></html>
