<!doctype html><html><meta charset="utf-8"><title>Whole-site responsive checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run whole-site responsive checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Arabic preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {entry} from '/shape-land/src/arabic/model.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
function progress(){return Number(doc().querySelector('[aria-label="الجولات المكتملة"]').getAttribute('aria-valuenow'))}
async function open(id){const card=doc().querySelector('.ar-art-'+id).closest('article');card.querySelector('button').click();await wait(()=>doc().querySelector('.ar-game'),'Game did not open');await pause(100)}
async function back(){button('الألعاب ←').click();await wait(()=>doc().querySelector('.ar-game-cards'),'Back failed')}
async function layouts(label){for(const size of ['1920,1080','1024,768','768,1024','844,390','390,844','320,568']){select.value=size;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w&&doc().documentElement.scrollHeight<=h,label+' scrolling '+size);for(const node of doc().querySelectorAll('.ar-token:not(.ar-drag-ghost),.ar-magic-box,.ar-letter-node,.ar-picture-node,.ar-door,.site-bar button,.ar-progress button')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+size+' '+node.ariaLabel);assert(Math.min(r.width,r.height)>=39,label+' tiny target '+size+' '+node.ariaLabel)}assert(doc().querySelector('.site-credit').getBoundingClientRect().top<25,'Credit not at top');assert(frame.contentWindow.getComputedStyle(doc().querySelector('.ar-world')).direction==='rtl','RTL missing');for(const line of doc().querySelectorAll('.ar-lines line[data-pair]')){const c=line.dataset.pair,r=doc().querySelector('.ar-connect-board').getBoundingClientRect();for(const [sel,n]of [['data-letter','1'],['data-picture','2']]){const p=center(doc().querySelector(`[${sel}="${c}"]`));assert(Math.abs(Number(line.getAttribute('x'+n))-(p.x-r.left)*1000/r.width)<2&&Math.abs(Number(line.getAttribute('y'+n))-(p.y-r.top)*1000/r.height)<2,'Line lost resized endpoint')}}}select.value='1920,1080';resize();await pause(50);log(label+' six viewport bounds, credit, RTL and target sizes')}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');await check('Splash',false);doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub missing');await check('Learning Hub',false);doc().querySelector('.ll-art-shapes').closest('button').click();await wait(()=>doc().querySelector('.game-cards'),'Shapes home');await check('Shapes menu',false);for(const title of ['Shape Detective','Hungry Monsters','Shape Shadows']){const card=[...doc().querySelectorAll('.game-card')].find(c=>c.querySelector('h2').textContent===title);card.querySelector('button').click();await wait(()=>doc().querySelector('.game'),'Shape game missing');await check(title,true);button('← Games').click();await wait(()=>doc().querySelector('.game-cards'),'Back to shapes failed');}button('⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub missing');doc().querySelector('.ll-art-letters').closest('button').click();await wait(()=>doc().querySelector('.ll-game-cards'),'English menu missing');await check('English menu',false);for(const title of [...doc().querySelectorAll('.ll-game-card h2')].map(n=>n.textContent)){const card=[...doc().querySelectorAll('.ll-game-card')].find(c=>c.querySelector('h2').textContent===title);if(card.querySelector('button').disabled)continue;card.querySelector('button').click();await wait(()=>doc().querySelector('.ll-game-page,.move-game,.arcade'),'English game missing');await check(title,true);button('← Games').click();await wait(()=>doc().querySelector('.ll-game-cards'),'English back failed');}button('⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub missing');doc().querySelector('.ll-art-arabic').closest('button').click();await wait(()=>doc().querySelector('.ar-home'),'Arabic home missing');await check('Arabic menu',false);status.textContent='All site responsive checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.message+'\n';console.error(e)}finally{run.disabled=false}};
async function check(label,game){for(const size of ['1920,1080','1366,768','1024,768','768,1024','844,390','390,844','320,568']){select.value=size;if(!select.value){const option=document.createElement('option');option.value=size;option.textContent=size;select.append(option);select.value=size;}resize();await pause(100);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+size);if(game)assert(doc().documentElement.scrollHeight<=h,label+' gameplay scrolling '+size);assert(doc().querySelector('.site-credit').getBoundingClientRect().top<25,label+' missing top credit');for(const node of doc().querySelectorAll(game?'.site-bar button,.ll-answer,.ll-replay,.shape-tile,.destination,.move-letter-token:not(.move-drag-ghost),.move-picture-token:not(.move-drag-ghost),.move-treasure-box,.move-letter-house,.move-match-node,.move-tracing-svg,.move-trace-controls button,.arc-balloon-button,.arc-letter-button,.arc-egg-button':'.site-bar button,.splash-enter')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+size+' '+node.ariaLabel);}}select.value='1920,1080';resize();await pause(60);log(label+' seven viewport bounds and top copyright');}
</script></html>
