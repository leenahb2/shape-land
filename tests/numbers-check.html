<!doctype html><html><meta charset="utf-8"><title>Numbers arcade checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Numbers arcade checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Arabic preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
function progress(){return Number(doc().querySelector('[aria-label="Numbers learning progress"]').getAttribute('aria-valuenow'));}
async function open(id){doc().querySelector('.nu-menu-'+id).closest('article').querySelector('button').click();await wait(()=>doc().querySelector('.nu-game'),'Numbers game failed to open');await pause(80);}
async function back(){button('← Games').click();await wait(()=>doc().querySelector('.section-numbers'),'Numbers menu missing');}
async function choose(numbers){button('⚙ Teacher Settings').click();await wait(()=>doc().querySelector('.nu-number-picker'),'Numbers settings missing');button('Clear All').click();await pause(10);for(const n of numbers){doc().querySelector(`[aria-label="Number ${n}"]`).click();await pause(8);}button('Done ✓').click();await pause(30);}
async function layouts(label){for(const value of sizes){if(![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value;resize();await pause(110);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+value);assert(doc().documentElement.scrollHeight<=h,label+' gameplay scrolling '+value);for(const node of doc().querySelectorAll('.nu-piece:not(.nu-drag-ghost),.nu-dino-mouth,.nu-garden-bed,.nu-number-block:not(.nu-drag-ghost),.nu-build-slot,.nu-swimming-fish,.nu-hook,.nu-fishing-controls button,.site-bar button,.nu-progress button')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+value+' '+node.ariaLabel+' '+JSON.stringify({left:r.left,top:r.top,width:r.width,height:r.height}));assert(Math.min(r.width,r.height)>=39,label+' tiny control '+value+' '+node.ariaLabel);}}select.value='1920,1080';resize();await pause(70);log(label+' seven viewport bounds and touch targets');}
async function waitNext(round,total){await wait(()=>round===total-1?doc().querySelector('.nu-finale'):!doc().querySelector('.nu-reward'),'Round did not advance',6000);}
async function quantityRound(type,round,check=false){const q=Number(doc().querySelector(type==='dino'?'.nu-count-badge>b':'.nu-garden-sign>b').textContent),zone=doc().querySelector(type==='dino'?'.nu-dino-mouth':'.nu-garden-bed'),pieces=()=>[...doc().querySelectorAll('[data-piece]')],count=()=>doc().querySelector(type==='dino'?'.nu-count-badge>span':'.nu-bed-count').textContent;
if(check){const first=q===0?pieces().find(n=>n.dataset.empty==='true'):pieces()[0];await drag(first,{x:3,y:3});assert(progress()===round,'Outside drop scored');await drag(first,center(zone),true);assert(progress()===round,'Cancelled drop scored');const before=count();const point=center(first),id=++pointer;emit(first,'pointerdown',point,id,false);emit(first,'pointermove',center(zone),id,false);emit(first,'pointerup',center(zone),id,false);await pause(20);assert(count()===before,'Secondary pointer counted');if(q===0){await drag(pieces().find(n=>n.dataset.empty!=='true'),center(zone));assert(progress()===round,'A fruit/seed scored in zero task');}log(type+' rejects outside/cancelled/secondary pointer and wrong zero input');}
if(q===0){const empty=pieces().find(n=>n.dataset.empty==='true');empty.click();await pause(15);zone.click();await pause(25);}else{const first=pieces()[0];await drag(first,center(zone));assert(count().startsWith('1 '),'First object did not count');await pause(430);const before=count();first.click();zone.click();await pause(25);assert(count()===before,'Duplicate object counted');for(let n=1;n<q;n++){const p=pieces()[0];if(n%2){p.click();await pause(10);zone.click();await pause(30);}else await drag(p,center(zone));await pause(430);}}
assert(progress()===round+1,'Quantity did not finish '+type+' '+q);const final=count();for(const node of pieces())node.click();zone.click();await pause(15);assert(count()===final,'Overcount after completion');}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-numbers');frame.contentWindow.localStorage.setItem('little-learners-numbers',JSON.stringify({numbers:[0,2,3],difficulty:'medium',speech:false,effects:false,celebrations:false,reach:true,pauseMotion:false}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-numbers'),'Numbers card missing');assert(!doc().querySelector('.ll-art-numbers').closest('button').disabled,'Numbers disabled');assert(!doc().querySelector('.ll-art-colors').closest('button').disabled,'Colors not activated');doc().querySelector('.ll-art-numbers').closest('button').click();await wait(()=>doc().querySelector('.section-numbers'),'Numbers menu missing');assert(doc().querySelectorAll('.nu-menu-card').length===4,'Not four number games');log('Numbers activated, unified four-card menu, Colors also active');
for(const type of ['dino','garden']){status.textContent='Testing '+type;await open(type);assert(button('♫ Replay Instruction').disabled,'Speech off not respected');await layouts(type);for(let round=0;round<5;round++){await quantityRound(type,round,round===0);await waitNext(round,5);}assert(doc().querySelector('.nu-finale-art svg'),'Illustrated finale missing');if(type==='garden'){const groups=[...doc().querySelectorAll('.nu-finale-bed')];assert(groups.length===5,'Entire garden missing');for(const bed of groups){const n=Number(bed.querySelector('span').textContent.split(' ')[0]);assert(bed.querySelectorAll('svg').length===(n===0?1:n),'Final garden quantity incorrect');}}log(type+' all five rounds, exact quantities including zero, duplicate/overcount protection, drag and tap');button('Play Again ↻').click();await wait(()=>!doc().querySelector('.nu-finale'),'Replay failed');assert(progress()===0,'Replay retained score');await back();await choose([10]);await open(type);await layouts(type+' quantity 10');await quantityRound(type,0,true);log(type+' ten-object round completed');await back();await choose([0,2,3]);}
status.textContent='Testing Tower';await choose(Array.from({length:11},(_,n)=>n));await open('tower');await layouts('Tower up to ten blocks');const initial=doc().querySelector('.nu-build-slot').getBoundingClientRect();for(let round=0;round<3;round++){const plan=[...doc().querySelectorAll('.nu-tower-plan>span')],prefilled=plan.filter(n=>n.classList.contains('nu-plan-filled')).length;const nums=[...doc().querySelectorAll('[data-block]')].map(n=>Number(n.dataset.block)).sort((a,b)=>a-b);if(round===1){assert(prefilled>0&&plan.some(n=>n.textContent==='?'),'Missing number challenge absent');}const slot=doc().querySelector('.nu-build-slot');if(!round){const wrong=doc().querySelector(`[data-block="${nums.at(-1)}"]`);await drag(wrong,center(slot));assert(!doc().querySelector('[data-built]'),'Wrong tower block accepted');await drag(doc().querySelector(`[data-block="${nums[0]}"]`),center(slot),true);assert(!doc().querySelector('[data-built]'),'Cancelled tower block accepted');}for(let j=0;j<nums.length;j++){const node=doc().querySelector(`[data-block="${nums[j]}"]`);if(j%2){node.click();await pause(10);slot.click();await pause(20);}else await drag(node,center(slot));assert(Math.abs(slot.getBoundingClientRect().top-initial.top)<2,'Tower slot moved out of reach');}assert(progress()===round+1,'Tower did not finish');assert(doc().querySelector('.nu-tower-builder'),'Tower character missing');await waitNext(round,3);}log('Tower three full sequences, missing-number challenge, wrong/cancel protection and fixed reachable slot');await back();await choose([2,4,7]);assert(doc().querySelector('.nu-menu-tower').closest('article').querySelector('button').disabled,'Nonconsecutive tower accepted');await choose([7]);await open('tower');assert(doc().querySelectorAll('[data-block]').length===1,'Single-number tower invalid');await back();log('Tower subset validation and single-number support');
status.textContent='Testing Fishing';await choose([0,2,3]);await open('fishing');await layouts('Fishing');let fish=doc().querySelector('[data-fish]'),first=center(fish);await pause(1300);assert(Math.hypot(center(fish).x-first.x,center(fish).y-first.y)>2,'Fish stationary');button('Ⅱ Pause motion').click();await pause(40);const frozen=center(fish);await pause(250);assert(Math.hypot(center(fish).x-frozen.x,center(fish).y-frozen.y)<.5,'Fish pause failed');button('▶ Resume motion').click();await pause(100);for(let round=0;round<6;round++){const question=doc().querySelector('.nu-instructions h1').textContent.toLowerCase(),words=['zero','one','two','three','four','five','six','seven','eight','nine','ten'],target=words.findIndex(w=>question.includes('number '+w)),right=()=>doc().querySelector(`[data-fish="${target}"]`),hook=()=>doc().querySelector('[data-hook]');if(!round){const wrong=[...doc().querySelectorAll('[data-fish]')].find(n=>Number(n.dataset.fish)!==target);await drag(hook(),center(wrong));assert(progress()===0,'Wrong fish counted');await drag(hook(),center(right()),true);assert(progress()===0,'Cancelled hook counted');await drag(hook(),{x:2,y:2});assert(progress()===0,'Outside hook scored');log('Fish movement, pause/resume, wrong/outside/cancelled hook validated');}if(round%2){right().click();await pause(30);assert(progress()===round,'Tap fish directly completed round');button('Lift hook ↑').click();await pause(35);}else await drag(hook(),center(right()));assert(progress()===round+1,'Hook catch failed '+target);assert(doc().querySelector('.nu-fish-caught'),'Catch animation missing');await waitNext(round,6);}log('Fishing six full rounds, controlled moving hook, tap-to-move + separate lift, catches and bucket finale');button('Play Again ↻').click();await wait(()=>doc().querySelector('.nu-pond'),'Fishing replay failed');button('⚙ Teacher Settings').click();await wait(()=>button('Apply & Restart'),'In-game settings missing');button('Apply & Restart').click();await pause(80);assert(progress()===0,'Teacher restart retained score');await back();await choose([]);assert([...doc().querySelectorAll('.nu-menu-card>button')].every(b=>b.disabled),'Empty selection starts games');await choose([0]);await open('dino');assert(progress()===0,'Zero auto-completed');await back();button('⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');log('Empty selection guard, explicit zero action, teacher restart, Games and Home');status.textContent='All Numbers arcade checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.message+'\n';console.error(e);}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-numbers');else frame.contentWindow.localStorage.setItem('little-learners-numbers',saved);}run.disabled=false;}};
</script></html>
