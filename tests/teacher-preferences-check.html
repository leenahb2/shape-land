<!doctype html><html><meta charset="utf-8"><title>Teacher preferences persistence audit</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Teacher preferences persistence audit</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Design preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
const cats=['shapes','letters','numbers','colors','concepts','arabic','arabic-shapes','arabic-colors'];
const menu=()=>doc().querySelector('.adventure-grid');
function navButton(word){return [...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes(word));}
function credit(){const nodes=doc().querySelectorAll('.site-credit');assert(nodes.length===1,'Credit must have one mounted copy');assert(nodes[0].textContent==='Made with love by Ms. Leena','Credit spelling');const r=nodes[0].getBoundingClientRect();assert(r.top>=0&&r.top<15&&r.bottom<=45,'Credit not at top');assert(frame.contentWindow.getComputedStyle(nodes[0]).zIndex==='200','Credit hidden behind overlay');}
run.onclick=async()=>{run.disabled=true;report.textContent='';const saved=new Map(),expected=new Map();const keys=['shape-land-settings','little-learners-letters','little-learners-numbers','little-learners-colors','little-learners-concepts','little-learners-arabic','little-learners-arabic-shapes','little-learners-arabic-colors'];try{const w=frame.contentWindow;for(const k of keys)saved.set(k,w.localStorage.getItem(k));await wait(()=>doc().querySelector('.splash-enter'),'Splash');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('[data-category]'),'Hub');
const signature=()=>[...doc().querySelectorAll('[role=dialog] [aria-pressed]')].map(n=>[n.ariaLabel||n.textContent.trim(),n.getAttribute('aria-pressed')]);
for(const category of cats){status.textContent=category;doc().querySelector(`[data-category="${category}"]`).click();await wait(()=>menu(),'Menu');doc().querySelector('[aria-label="Teacher Settings"],[aria-label="إعدادات المعلّمة"]').click();await wait(()=>doc().querySelector('[role=dialog]'),'Settings');const dialog=doc().querySelector('[role=dialog]');for(const b of [...dialog.querySelectorAll('[aria-pressed]')]){if(b.disabled||b.closest('.ui-segments'))continue;const before=b.getAttribute('aria-pressed');b.click();await pause(20);const after=b.getAttribute('aria-pressed');if(after===before){assert(category==='shapes'&&dialog.querySelectorAll('.shape-picker [aria-pressed=true]').length===1,'Nonresponsive toggle '+category+' '+b.textContent);continue;}b.click();await pause(20);assert(b.getAttribute('aria-pressed')===before,'Toggle did not restore '+category);}
const difficulty=dialog.querySelector('.ui-segments [aria-pressed=false]');difficulty.click();await pause(25);assert(difficulty.getAttribute('aria-pressed')==='true','Difficulty failed');expected.set(category,JSON.stringify(signature()));dialog.querySelector('button[aria-label*=Close],button[aria-label="إغلاق الإعدادات"],.close').click();await wait(()=>!doc().querySelector('[role=dialog]'),'Done');navButton(category.startsWith('arabic')?'الرئيسية':'Home').click();await wait(()=>doc().querySelector('[data-category]'),'Home');log(category+' visible practice/classroom toggles and difficulty work');}
await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});w.location.reload();});await wait(()=>doc().querySelector('.splash-enter'),'Reload');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('[data-category]'),'Reload Hub');for(const category of cats){doc().querySelector(`[data-category="${category}"]`).click();await wait(()=>menu(),'Reload menu');doc().querySelector('[aria-label="Teacher Settings"],[aria-label="إعدادات المعلّمة"]').click();await wait(()=>doc().querySelector('[role=dialog]'),'Reload settings');assert(JSON.stringify(signature())===expected.get(category),'Saved selections changed '+category);doc().querySelector('[role=dialog] button[aria-label*=Close],[role=dialog] button[aria-label="إغلاق الإعدادات"],[role=dialog] .close').click();await wait(()=>!doc().querySelector('[role=dialog]'),'Close');navButton(category.startsWith('arabic')?'الرئيسية':'Home').click();await wait(()=>doc().querySelector('[data-category]'),'Home');log(category+' selections persist through full page reload');}status.textContent='All teacher preference checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.stack;}finally{for(const[k,v]of saved){if(v===null)frame.contentWindow.localStorage.removeItem(k);else frame.contentWindow.localStorage.setItem(k,v);}run.disabled=false;}};</script></html>
