<!doctype html><html><meta charset="utf-8"><title>Full-site stress and resource audit</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Full-site stress and resource audit</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Design preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';

run.onclick=async()=>{run.disabled=true;report.textContent='';const saved=new Map();let restore=()=>{},observer;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash');const w=frame.contentWindow,store=w.localStorage;const presets={'shape-land-settings':{shapes:['circle','square','triangle','rectangle','heart','star','diamond','oval'],difficulty:'easy',sound:false,voice:false,size:110},'little-learners-letters':{letters:['A','B','C','S','T'],difficulty:'medium',sound:false,reach:true,arcadeAudio:{speech:false,effects:false,cheering:false}},'little-learners-numbers':{numbers:[0,1,2,3,4,5],difficulty:'medium',speech:false,effects:false,celebrations:false},'little-learners-colors':{colors:['red','blue','yellow','green','orange','purple','pink','white','black','brown','gray'],difficulty:'medium',voice:false,effects:false,cheering:false},'little-learners-concepts':{difficulty:'medium',voice:false,effects:false,cheering:false},'little-learners-arabic':{letters:['أ','ب','ت','س'],difficulty:'medium',rewardEffects:false,rewardCelebrations:false},'little-learners-arabic-shapes':{shapes:['circle','square','triangle','crescent','hexagon'],difficulty:'medium',effects:false,celebrations:false},'little-learners-arabic-colors':{colors:['red','blue','yellow','green','orange','purple','pink','white','black','gray','gold','silver'],difficulty:'medium',effects:false,celebrations:false}};for(const[k,v]of Object.entries(presets)){saved.set(k,store.getItem(k));store.setItem(k,JSON.stringify(v));}
await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Reloaded preferences');
const original={raf:w.requestAnimationFrame.bind(w),cancel:w.cancelAnimationFrame.bind(w),timer:w.setTimeout.bind(w),clear:w.clearTimeout.bind(w),ro:w.ResizeObserver,add:w.addEventListener.bind(w),remove:w.removeEventListener.bind(w),docAdd:w.document.addEventListener.bind(w.document),docRemove:w.document.removeEventListener.bind(w.document),media:w.matchMedia.bind(w)};const frames=new Set(),timers=new Set(),ros=new Set(),listeners=new Set(),keys=new Set(),media=new Map(),samples=[],longTasks=[];
w.requestAnimationFrame=callback=>{let id;id=original.raf(t=>{frames.delete(id);callback(t);});frames.add(id);return id;};w.cancelAnimationFrame=id=>{frames.delete(id);original.cancel(id);};w.setTimeout=(cb,delay,...args)=>{let id;id=original.timer(()=>{timers.delete(id);if(typeof cb==='function')cb(...args);},delay);timers.add(id);return id;};w.clearTimeout=id=>{timers.delete(id);original.clear(id);};w.ResizeObserver=class extends original.ro{constructor(cb){super(cb);ros.add(this);}disconnect(){ros.delete(this);super.disconnect();}};w.addEventListener=(type,fn,opt)=>{if(type==='resize')listeners.add(fn);original.add(type,fn,opt);};w.removeEventListener=(type,fn,opt)=>{if(type==='resize')listeners.delete(fn);original.remove(type,fn,opt);};w.document.addEventListener=(type,fn,opt)=>{if(type==='keydown')keys.add(fn);original.docAdd(type,fn,opt);};w.document.removeEventListener=(type,fn,opt)=>{if(type==='keydown')keys.delete(fn);original.docRemove(type,fn,opt);};w.matchMedia=query=>{const m=original.media(query),add=m.addEventListener.bind(m),remove=m.removeEventListener.bind(m);m.addEventListener=(type,fn,opt)=>{if(type==='change'){if(!media.has(m))media.set(m,new Set());media.get(m).add(fn);}add(type,fn,opt);};m.removeEventListener=(type,fn,opt)=>{media.get(m)?.delete(fn);if(media.get(m)?.size===0)media.delete(m);remove(type,fn,opt);};return m;};
restore=()=>{w.requestAnimationFrame=original.raf;w.cancelAnimationFrame=original.cancel;w.setTimeout=original.timer;w.clearTimeout=original.clear;w.ResizeObserver=original.ro;w.addEventListener=original.add;w.removeEventListener=original.remove;w.document.addEventListener=original.docAdd;w.document.removeEventListener=original.docRemove;w.matchMedia=original.media;};
const supportsLongTasks=w.PerformanceObserver?.supportedEntryTypes?.includes('longtask');if(supportsLongTasks){observer=new w.PerformanceObserver(list=>longTasks.push(...list.getEntries()));observer.observe({entryTypes:['longtask']});}
doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('[data-category]'),'Hub');await pause(100);const baseline={frames:frames.size,timers:timers.size,observers:ros.size,resize:listeners.size,keys:keys.size,media:media.size};log('Hub resource baseline '+JSON.stringify(baseline));let opened=0;
for(let cycle=0;cycle<2;cycle++)for(const category of ['shapes','letters','numbers','colors','concepts','arabic','arabic-shapes','arabic-colors']){status.textContent='Cycle '+(cycle+1)+' · '+category;doc().querySelector(`[data-category="${category}"]`).click();await wait(()=>menu(),'Menu');const count=menu().querySelectorAll('article').length;for(let i=0;i<count;i++){const start=menu().querySelectorAll('article')[i].querySelector('button');assert(!start.disabled,'Stress curriculum unexpectedly disabled a game');const name=menu().querySelectorAll('article')[i].querySelector('h2').textContent;const at=w.performance.now();start.click();await wait(()=>doc().querySelector('.game,.ll-game-page,.arcade,.move-game,.nu-game,.co-game,.cw-game,.ar-game'),'Game '+name);await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));samples.push({name,ms:+(w.performance.now()-at).toFixed(1)});opened++;
const before=doc().querySelector('.game-top .progress,.ll-game-progress,.arc-progress,.nu-progress,.co-progress,.cw-progress,.ar-progress')?.textContent;doc().querySelector('[aria-label="Teacher Settings"],[aria-label="إعدادات المعلّمة"]').click();await wait(()=>doc().querySelector('[role=dialog]'),'Settings');credit();doc().querySelector('[role=dialog] button[aria-label*=Close],[role=dialog] button[aria-label="إغلاق الإعدادات"],[role=dialog] .close').click();await wait(()=>!doc().querySelector('[role=dialog]'),'Close');assert(doc().querySelector('.game-top .progress,.ll-game-progress,.arc-progress,.nu-progress,.co-progress,.cw-progress,.ar-progress')?.textContent===before,'Settings changed current progress '+name);navButton(category.startsWith('arabic')?'الألعاب':'Games').click();await wait(()=>menu(),'Back');await pause(35);}
navButton(category.startsWith('arabic')?'الرئيسية':'Home').click();await wait(()=>doc().querySelector('[data-category]'),'Home');await pause(100);const current={frames:frames.size,timers:timers.size,observers:ros.size,resize:listeners.size,keys:keys.size,media:media.size};assert(JSON.stringify(current)===JSON.stringify(baseline),'Resources survived exit '+category+' '+JSON.stringify(current));log('Cycle '+(cycle+1)+' '+category+': every game opens, settings resume, Back/Home and resource baseline restored');}
const times=samples.map(s=>s.ms).sort((a,b)=>a-b);log(opened+' game mounts; click-to-DOM-plus-two-frames ms: median '+times[Math.floor(times.length*.5)]+', p95 '+times[Math.floor(times.length*.95)]+'; development browser, automated timings, not physical input latency');log(supportsLongTasks?'Long-task API: '+longTasks.length+' tasks; max '+Math.max(0,...longTasks.map(t=>t.duration)).toFixed(1)+'ms (includes test/browser workload)':'Long-task API unavailable in this browser; no FPS/long-task claim');status.textContent='All site stress checks passed';
}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.stack;}finally{observer?.disconnect();restore();for(const[k,v]of saved){if(v===null)frame.contentWindow.localStorage.removeItem(k);else frame.contentWindow.localStorage.setItem(k,v);}run.disabled=false;}};</script></html>
