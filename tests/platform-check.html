<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Little Learners Land · layout checks</title><style>body{margin:0;background:#eee9e3;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px}button,select{padding:10px}#wrap{margin:12px}iframe{border:0;transform-origin:top left;background:#fffaf1}pre{white-space:pre-wrap;padding:12px}</style></head><body><nav><label>Viewport <select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape 1024 × 768</option><option value="768,1024">iPad portrait 768 × 1024</option><option value="1366,768">Laptop 1366 × 768</option><option value="390,844">Phone 390 × 844</option><option value="844,390">Short landscape 844 × 390</option></select></label><button id="check">Check layout</button></nav><div id="wrap"><iframe title="Learning platform preview" src="/shape-land/"></iframe></div><pre id="report" role="status">Choose a viewport and play an adventure, then check layout.</pre><script>
const frame=document.querySelector('iframe'),select=document.querySelector('select'),wrap=document.querySelector('#wrap');function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();document.querySelector('#check').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;const controls=[...d.querySelectorAll('.ll-answer,.ll-game-page .ll-nav button,.ll-replay,.shape-tile,.destination,.splash-enter')];const outside=controls.filter(el=>{const r=el.getBoundingClientRect();return r.left<0||r.top<0||r.right>w+.5||r.bottom>h+.5}).map(el=>el.getAttribute('aria-label')||el.textContent);const answer=[...d.querySelectorAll('.ll-answer,.shape-tile,.destination')];document.querySelector('#report').textContent=JSON.stringify({viewport:[w,h],horizontalOverflow:d.documentElement.scrollWidth>w,gameplayScroll:!!d.querySelector('.ll-game-page,.game')&&d.documentElement.scrollHeight>h,controlsOutsideViewport:outside,answerTargets:answer.length,smallestAnswer:answer.length?Math.round(Math.min(...answer.map(e=>Math.min(e.getBoundingClientRect().height,e.getBoundingClientRect().width)))):null},null,2);};
</script></body></html>
