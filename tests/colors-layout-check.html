<!doctype html><html><meta charset="utf-8"><title>Colors resize interaction checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Colors resize interaction checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Colors preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {COLORS,RECIPES,mixResult,SCENES,DIRTY_ZONES} from "/shape-land/src/colors/colorData.js";
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
const buttonStarts=text=>[...doc().querySelectorAll('button')].find(b=>b.textContent.trim().startsWith(text));
const colorsByName=COLORS.slice().sort((a,b)=>b.name.length-a.name.length);
function targetColor(){const text=doc().querySelector('.co-instructions h1').textContent.toLowerCase();return colorsByName.find(c=>text.endsWith(c.name.toLowerCase()+'!')||text.includes('place '+c.name.toLowerCase()+' '))?.id;}
function progress(){return Number(doc().querySelector('[aria-label="Colors learning progress"]').getAttribute('aria-valuenow'));}
async function open(id){doc().querySelector('.co-menu-'+id).closest('article').querySelector('button').click();await wait(()=>doc().querySelector('.co-game'),'Game failed to open');await pause(100);}
async function back(){buttonStarts('Games');const b=[...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes('Games'));b.click();await wait(()=>doc().querySelector('.section-colors'),'Colors menu missing');}
async function choose(ids){buttonStarts('Choose colors')?.click();if(!doc().querySelector('.co-color-picker'))doc().querySelector('.site-bar button[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.co-color-picker'),'Settings missing');button('Clear All').click();await pause(10);for(const id of ids){doc().querySelector(`.co-color-picker [aria-label="${COLORS.find(c=>c.id===id).name}"]`).click();await pause(5);}buttonStarts('Done').click();await pause(30);}
async function layouts(label){for(const value of sizes){if(![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value;resize();await pause(110);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+value);assert(doc().documentElement.scrollHeight<=h,label+' gameplay scroll '+value);for(const node of doc().querySelectorAll('.site-bar button,.co-progress button,.co-bottle:not(.co-drag-ghost),.co-beaker,.co-lab-actions button,.co-toy:not(.co-drag-ghost),.co-sort-bin,.co-factory-top button,.co-palette-color,.co-paint-tools button,.co-wash-tools button,.co-wash-modes button,.co-bridge-slot,.co-bridge-piece:not(.co-drag-ghost),.co-scene-svg,.co-vehicle-svg')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+value+' '+(node.ariaLabel||node.textContent)+' '+JSON.stringify({x:r.left,y:r.top,w:r.width,h:r.height}));if(!node.matches('svg'))assert(Math.min(r.width,r.height)>=33,label+' tiny control '+value+' '+node.ariaLabel);}}select.value='1920,1080';resize();await pause(70);log(label+' seven viewport bounds, full scene and no gameplay scroll');}
async function next(round,total){await wait(()=>round===total-1?doc().querySelector('.co-finale'):!doc().querySelector('.co-reward'),'Round did not advance',7000);await pause(120);}
function screen(svg,p){const a=svg.createSVGPoint();a.x=p.x;a.y=p.y;return a.matrixTransform(svg.getScreenCTM());}
async function svgGesture(svg,points,cancel=false){const id=++pointer;emit(svg,'pointerdown',screen(svg,points[0]),id);for(const p of points.slice(1)){emit(svg,'pointermove',screen(svg,p),id);await pause(3);}emit(svg,cancel?'pointercancel':'pointerup',screen(svg,points.at(-1)),id);await pause(30);}
async function tapSVG(svg,p){const id=++pointer;emit(svg,'pointerdown',screen(svg,p),id);emit(svg,'pointerup',screen(svg,p),id);await pause(25);}
function regionPoint(scene,region){const spec=SCENES.find(s=>s.id===scene).regions.find(r=>r.id===region),r=spec.hitRects?.[0]||spec.rect;return {x:r[0]+r[2]/2,y:r[1]+r[3]/2};}
run.onclick=async()=>{run.disabled=true;report.textContent='';let saved;try{
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-colors');frame.contentWindow.localStorage.setItem('little-learners-colors',JSON.stringify({colors:COLORS.map(c=>c.id),difficulty:'medium',voice:false,effects:false,cheering:false,reach:true,pauseMotion:false}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-colors'),'Hub missing');doc().querySelector('.ll-art-colors').closest('button').click();await wait(()=>doc().querySelector('.section-colors'),'Menu missing');
 for(const size of sizes){status.textContent='Testing '+size;if(![...select.options].some(o=>o.value===size))select.add(new Option(size,size));select.value=size;resize();await pause(100);
  if(Number(size.split(',')[0])>=1024)assert(frame.contentWindow.getComputedStyle(doc().querySelector('.adventure-grid')).gridTemplateColumns.split(' ').length===3,'Menu must have three desktop columns');
  await open('lab');const target=targetColor(),ingredient=RECIPES[target][0];await drag(doc().querySelector(`[data-bottle="${ingredient}"]`),center(doc().querySelector('.co-beaker')));assert(doc().querySelector(`[data-bottle="${ingredient}"]`).disabled,'Resized pour failed '+size);await back();
  await open('factory');const toy=doc().querySelector('[data-toy]'),count=doc().querySelectorAll('[data-toy]').length;await drag(toy,center(doc().querySelector(`[data-bin="${toy.dataset.color}"]`)));assert(doc().querySelectorAll('[data-toy]').length===count-1,'Resized sorting failed '+size);await back();
  await open('paint');const region=doc().querySelector('.co-current-region').dataset.region,id=targetColor();doc().querySelector(`[data-paint="${id}"]`).click();await pause(15);await svgGesture(doc().querySelector('.co-scene-svg'),[{...regionPoint('house',region),x:regionPoint('house',region).x-15},regionPoint('house',region)]);assert(doc().querySelector('.co-painted-region'),'Resized brush failed '+size);await back();
  await open('wash');const svg=doc().querySelector('.co-vehicle-svg');for(const y of [205,300])await svgGesture(svg,Array.from({length:31},(_,i)=>({x:100+i*20,y})));assert(doc().querySelector('.co-palette'),'Resized scrub failed '+size);await back();
  await open('bridge');await drag(doc().querySelector('[data-bridge-piece][data-color="red"]'),center(doc().querySelector('.co-bridge-slot')));assert(doc().querySelector('.co-bridge-slot span').textContent.includes('1 / 6'),'Resized bridge failed '+size);await back();log(size+': all five games accepted correctly mapped pointer gestures after resize');
 }
 status.textContent='All Colors resize interaction checks passed';
 }catch(error){status.textContent='FAILED';report.textContent+='FAIL: '+(error.stack||error);console.error(error);}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-colors');else frame.contentWindow.localStorage.setItem('little-learners-colors',saved);}run.disabled=false;}
};
</script></html>
