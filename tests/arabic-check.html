<!doctype html><html><meta charset="utf-8"><title>Arabic arcade checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Arabic checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Arabic preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {entry} from '/shape-land/src/arabic/model.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text||(text==='الألعاب ←'&&b.textContent.includes('الألعاب'))||(text==='⚙ إعدادات المعلّمة'&&b.textContent.includes('إعدادات المعلّمة')));
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
function progress(){return Number(doc().querySelector('[aria-label="الجولات المكتملة"]').getAttribute('aria-valuenow'))}
async function open(id){const card=doc().querySelector('.ar-art-'+id).closest('article');card.querySelector('button').click();await wait(()=>doc().querySelector('.ar-game'),'Game did not open');await pause(100)}
function silent(){assert(frame.contentWindow.arAudioCalls.length===0,'Arabic attempted audio: '+frame.contentWindow.arAudioCalls.join(','));assert(![...doc().querySelectorAll('.ar-world button')].some(b=>/أعد السؤال|إعادة سماع|صوت|احتفال|التعليق/.test(b.textContent)),'Arabic audio controls still visible');}
async function back(){silent();button('الألعاب ←').click();await wait(()=>doc().querySelector('.ar-game-cards'),'Back failed')}
async function layouts(label){for(const size of ['1920,1080','1024,768','768,1024','844,390','390,844','320,568']){select.value=size;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w&&doc().documentElement.scrollHeight<=h,label+' scrolling '+size);for(const node of doc().querySelectorAll('.ar-token:not(.ar-drag-ghost),.ar-magic-box,.ar-letter-node,.ar-picture-node,.ar-door,.site-bar button,.ar-progress button')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+size+' '+node.ariaLabel);assert(Math.min(r.width,r.height)>=39,label+' tiny target '+size+' '+node.ariaLabel)}assert(doc().querySelector('.site-credit').getBoundingClientRect().top<25,'Credit not at top');assert(frame.contentWindow.getComputedStyle(doc().querySelector('.ar-world')).direction==='rtl','RTL missing');for(const line of doc().querySelectorAll('.ar-lines line[data-pair]')){const c=line.dataset.pair,r=doc().querySelector('.ar-connect-board').getBoundingClientRect();for(const [sel,n]of [['data-letter','1'],['data-picture','2']]){const p=center(doc().querySelector(`[${sel}="${c}"]`));assert(Math.abs(Number(line.getAttribute('x'+n))-(p.x-r.left)*1000/r.width)<2&&Math.abs(Number(line.getAttribute('y'+n))-(p.y-r.top)*1000/r.height)<2,'Line lost resized endpoint')}}}select.value='1920,1080';resize();await pause(50);log(label+' six viewport bounds, credit, RTL and target sizes')}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');const w=frame.contentWindow;w.arAudioCalls=[];const cancelled=w.speechSynthesis?.cancel.bind(w.speechSynthesis);if(w.speechSynthesis){w.speechSynthesis.speak=()=>w.arAudioCalls.push('speech');w.speechSynthesis.cancel=()=>cancelled?.();}w.AudioContext=class{constructor(){w.arAudioCalls.push('context')}};w.webkitAudioContext=w.AudioContext;w.Audio=class{constructor(){w.arAudioCalls.push('clip')}};saved=frame.contentWindow.localStorage.getItem('little-learners-arabic');frame.contentWindow.localStorage.setItem('little-learners-arabic',JSON.stringify({letters:['أ','ب','ت','س'],difficulty:'medium',narration:true,effects:true,celebrations:true,rewardEffects:false,rewardCelebrations:false,reach:true}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-arabic'),'Arabic hub card missing');assert(doc().querySelectorAll('.ll-category').length===8,'Not six cards');assert(doc().querySelectorAll('.ll-category:disabled').length===0&&!doc().querySelector('.ll-art-numbers').closest('button').disabled,'Coming Soon changed');doc().querySelector('.ll-art-arabic').closest('button').click();await wait(()=>doc().querySelector('.ar-home'),'Arabic home missing');log('Arabic hub card, All six categories active');
status.textContent='Hunt';await open('hunt');await layouts('Hunt');for(let round=0;round<5;round++){const name=doc().querySelector('.ar-instruction h1').textContent,valid=()=>[...doc().querySelectorAll('[data-token]')].filter(n=>name.includes(entry(n.dataset.char).name)),wrong=[...doc().querySelectorAll('[data-token]')].find(n=>!name.includes(entry(n.dataset.char).name));wrong.click();await pause(25);assert(progress()===round,'Wrong hunt advanced');while(valid().length){valid()[0].click();await pause(20)}assert(progress()===round+1,'Hunt did not finish');await wait(()=>round===4?doc().querySelector('.ar-finale'):!doc().querySelector('.ar-celebration'),'Hunt did not advance');}log('Hunt all five rounds, repeated targets and wrong answers');await back();
status.textContent='Box';await open('box');await layouts('Box');for(let round=0;round<5;round++){const name=doc().querySelector('.ar-instruction h1').textContent,zone=doc().querySelector('.ar-magic-box'),valid=()=>[...doc().querySelectorAll('[data-token]')].filter(n=>name.includes(entry(n.dataset.char).name));if(!round){const wrong=[...doc().querySelectorAll('[data-token]')].find(n=>!name.includes(entry(n.dataset.char).name));await drag(wrong,center(zone));assert(progress()===0,'Wrong drop scored');const token=valid()[0];await drag(token,{x:3,y:3});assert(doc().querySelector('.ar-box-count').textContent.includes('٠'),'Outside scored');await drag(token,center(zone),true);assert(doc().querySelector('.ar-box-count').textContent.includes('٠'),'Cancel scored');log('Box rejects wrong/outside/cancelled drops');}valid()[0].click();await pause(10);zone.click();await pause(20);while(valid().length)await drag(valid()[0],center(zone));assert(doc().querySelector('.ar-box-open .ar-box-surprise'),'Box reveal missing');assert(progress()===round+1,'Box progress');await wait(()=>round===4?doc().querySelector('.ar-finale'):!doc().querySelector('.ar-celebration'),'Box next missing');}log('Box all five rounds, drag, tap alternative and surprise');await back();
status.textContent='Matching';await open('matching');await layouts('Matching');for(let round=0;round<4;round++){const letters=()=>[...doc().querySelectorAll('[data-letter]:not(:disabled)')],picture=c=>doc().querySelector(`[data-picture="${c}"]`);if(!round){const first=letters()[0],c=first.dataset.letter,wrong=[...doc().querySelectorAll('[data-picture]')].find(n=>n.dataset.picture!==c);await drag(first,center(wrong));assert(!doc().querySelector('.ar-lines [data-pair]'),'Wrong connected');await pause(450);await drag(first,center(picture(c)),true);assert(!doc().querySelector('.ar-lines [data-pair]'),'Cancel connected');log('Matching rejects wrong and cancelled lines');}let i=0;while(letters().length){const l=letters()[0],c=l.dataset.letter;if(i++%2){l.click();await pause(10);picture(c).click();await pause(20)}else await drag(l,center(picture(c)));}assert(doc().querySelectorAll('.ar-lines [data-pair]').length===4,'Permanent lines missing');if(!round)await layouts('Permanent matching lines');assert(progress()===round+1,'Matching progress');await wait(()=>round===3?doc().querySelector('.ar-finale'):!doc().querySelector('.ar-celebration'),'Matching next missing');}log('Matching four complete sets, pointer and tap connections');await back();
status.textContent='Doors';await open('doors');await layouts('Doors');for(let round=0;round<8;round++){const name=doc().querySelector('.ar-instruction h1').textContent,doors=[...doc().querySelectorAll('[data-door]')],right=doors.find(n=>name.includes(entry(n.dataset.door).name)),wrong=doors.find(n=>n!==right);wrong.click();await pause(20);assert(!doc().querySelector('.ar-door-open'),'Wrong door opened');right.click();await pause(100);assert(doc().querySelector('.ar-door-open .ar-door-reveal'),'Reveal missing');assert(progress()===round+1,'Doors progress');await wait(()=>round===7?doc().querySelector('.ar-finale'):!doc().querySelector('.ar-celebration'),'Door next missing');}log('Doors eight complete rounds, wrong doors closed, animated reveals');await back();
button('⚙ إعدادات المعلّمة').click();await wait(()=>doc().querySelector('.ar-settings'),'Settings missing');button('مسح الكل').click();await pause(20);assert(doc().querySelectorAll('.ar-letter-picker [aria-pressed=true]').length===0,'Clear failed');button('هيا نلعب!').click();await pause(20);assert([...doc().querySelectorAll('.ar-menu-card button')].every(b=>b.disabled),'Empty settings starts games');button('اختيار الحروف').click();await pause(20);doc().querySelector('[aria-label="حرف الهاء"]').click();button('هيا نلعب!').click();await pause(30);await open('matching');assert(doc().querySelectorAll('[data-letter]').length===1,'Single pair missing');log('Empty selection guarded, standalone ه, single-pair matching');button('⚙ إعدادات المعلّمة').click();await wait(()=>button('تطبيق وإعادة اللعب'),'Restart missing');button('تطبيق وإعادة اللعب').click();await pause(100);assert(progress()===0,'Restart failed');button('⌂ الرئيسية').click();await wait(()=>doc().querySelector('.ll-categories'),'Home failed');assert(frame.contentWindow.arAudioCalls.length===0,'Arabic audio attempted');log('All four complete Arabic sessions remained silent despite enabled legacy preferences; audio controls absent');log('Restart and Home');status.textContent='All Arabic checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.message+'\n';console.error(e)}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-arabic');else frame.contentWindow.localStorage.setItem('little-learners-arabic',saved)}run.disabled=false}};
</script></html>
