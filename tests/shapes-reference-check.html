<!doctype html><html><meta charset="utf-8"><title>Play area reference audit</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Play area reference audit</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Design preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
const cats=['shapes','letters','numbers','colors','concepts','arabic'];
const menu=()=>doc().querySelector('.adventure-grid');
function navButton(word){return [...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes(word));}
function credit(){const nodes=doc().querySelectorAll('.site-credit');assert(nodes.length===1,'Credit must have one mounted copy');assert(nodes[0].textContent==='Made with love by Ms. Leena','Credit spelling');const r=nodes[0].getBoundingClientRect();assert(r.top>=0&&r.top<15&&r.bottom<=45,'Credit not at top');assert(frame.contentWindow.getComputedStyle(nodes[0]).zIndex==='200','Credit hidden behind overlay');}
async function atSizes(label,kind){for(const size of sizes){if(![...select.options].some(o=>o.value===size))select.add(new Option(size,size));select.value=size;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;credit();assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+size);if(kind==='game')assert(doc().documentElement.scrollHeight<=h,label+' game scrolling '+size);const buttons=[...doc().querySelectorAll('.site-bar button')].filter(b=>b.getClientRects().length>0);for(const b of buttons){const r=b.getBoundingClientRect();assert(r.left>=-.5&&r.right<=w+.5&&r.top>=0&&r.bottom<=h,label+' nav outside '+size);assert(r.height>=40&&r.width>=40,label+' nav target small '+size);}const title=doc().querySelector('.site-bar-title');if(title){const r=title.getBoundingClientRect();for(const b of buttons){const t=b.getBoundingClientRect();assert(!(r.left<t.right-1&&r.right>t.left+1&&r.top<t.bottom-1&&r.bottom>t.top+1),label+' title overlaps navigation '+size);}}
if(kind==='menu'){const cards=[...doc().querySelectorAll('.adventure-grid>article')],rects=cards.map(c=>c.getBoundingClientRect());for(const [i,r] of rects.entries()){assert(Math.abs(r.width-r.height)<3,label+' non-square card '+size+' '+i+' '+r.width+'x'+r.height);assert(r.left>=0&&r.right<=w+.5,label+' card outside '+size);const b=cards[i].querySelector('button'),t=cards[i].querySelector('h2').getBoundingClientRect(),br=b.getBoundingClientRect();assert(br.top>=t.bottom-1,label+' title/button overlap '+size);assert(br.height>=44,label+' small card button '+size);}if(w>=1024)assert(frame.contentWindow.getComputedStyle(menu()).gridTemplateColumns.split(' ').length===3,label+' desktop grid');if(w===820)assert(frame.contentWindow.getComputedStyle(menu()).gridTemplateColumns.split(' ').length===2,label+' portrait grid');}
if(kind==='settings'){const dialog=doc().querySelector('[role="dialog"]'),r=dialog.getBoundingClientRect();assert(r.top>=30&&r.left>=0&&r.right<=w&&r.bottom<=h,label+' modal outside '+size);const close=dialog.querySelector('button'),cr=close.getBoundingClientRect();assert(cr.top>=r.top&&cr.bottom<=h,label+' close hidden '+size);dialog.scrollTop=dialog.scrollHeight;await pause(15);const actions=dialog.querySelector('.nu-setting-actions,.co-setting-actions,.cw-setting-actions,.ar-settings-actions,.modal-foot,.ui-settings-actions');for(const b of actions.querySelectorAll('button')){const br=b.getBoundingClientRect();assert(br.top>=r.top&&br.bottom<=h&&br.right<=w&&br.left>=0,label+' modal action hidden '+size+' '+b.textContent);}dialog.scrollTop=0;assert(dialog.querySelectorAll('.ui-segments>button').length===2,label+' difficulty segments missing');}}
select.value='1920,1080';resize();await pause(80);if(kind==='game'){const rect=s=>{const n=doc().querySelector(s);if(!n)return null;const r=n.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};log(label+' '+JSON.stringify({zone:rect('.play-zone'),matching:rect('.matching-area'),tray:rect('.shape-tray'),main:rect('.ll-play,.arc-main,.move-main,.nu-main,.co-main,.cw-main,.ar-game-main')}));}log(label+' seven viewport checks');}
run.onclick=async()=>{run.disabled=true;report.textContent='';const saved=frame.contentWindow.localStorage.getItem('shape-land-settings');try{for(const reach of [false,true]){frame.contentWindow.localStorage.setItem('shape-land-settings',JSON.stringify({shapes:['circle','square','triangle','rectangle','heart','star','diamond','oval'],difficulty:'easy',sound:false,voice:false,reach,size:110}));await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub');doc().querySelector('.ll-art-shapes').closest('button').click();await wait(()=>menu(),'Menu');for(let i=0;i<3;i++){menu().querySelectorAll('article')[i].querySelector('button').click();await wait(()=>doc().querySelector('.shape-tray'),'Game');await pause(120);const metrics={reach,game:i};for(const cls of ['.play-zone','.matching-area','.shape-tray','.destinations']){const n=doc().querySelector(cls);if(n){const r=n.getBoundingClientRect();metrics[cls]={x:r.x,y:r.y,width:r.width,height:r.height}}}log(JSON.stringify(metrics));doc().querySelector('.game-top button').click();await wait(()=>menu(),'Back');}}status.textContent='Reference measured';}catch(e){status.textContent='FAILED';report.textContent+=e.stack;}finally{if(saved===null)frame.contentWindow.localStorage.removeItem('shape-land-settings');else frame.contentWindow.localStorage.setItem('shape-land-settings',saved);run.disabled=false;}};</script></html>
