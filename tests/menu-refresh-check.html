<!doctype html><html><meta charset="utf-8"><title>Menu refresh checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run menu refresh checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Arabic preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {entry} from '/shape-land/src/arabic/model.js';
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
function progress(){return Number(doc().querySelector('[aria-label="الجولات المكتملة"]').getAttribute('aria-valuenow'))}
async function open(id){const card=doc().querySelector('.ar-art-'+id).closest('article');card.querySelector('button').click();await wait(()=>doc().querySelector('.ar-game'),'Game did not open');await pause(100)}
async function back(){button('الألعاب ←').click();await wait(()=>doc().querySelector('.ar-game-cards'),'Back failed')}
async function layouts(label){for(const size of ['1920,1080','1024,768','768,1024','844,390','390,844','320,568']){select.value=size;resize();await pause(90);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w&&doc().documentElement.scrollHeight<=h,label+' scrolling '+size);for(const node of doc().querySelectorAll('.ar-token:not(.ar-drag-ghost),.ar-magic-box,.ar-letter-node,.ar-picture-node,.ar-door,.site-bar button,.ar-progress button')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+size+' '+node.ariaLabel);assert(Math.min(r.width,r.height)>=39,label+' tiny target '+size+' '+node.ariaLabel)}assert(doc().querySelector('.site-credit').getBoundingClientRect().top<25,'Credit not at top');assert(frame.contentWindow.getComputedStyle(doc().querySelector('.ar-world')).direction==='rtl','RTL missing');for(const line of doc().querySelectorAll('.ar-lines line[data-pair]')){const c=line.dataset.pair,r=doc().querySelector('.ar-connect-board').getBoundingClientRect();for(const [sel,n]of [['data-letter','1'],['data-picture','2']]){const p=center(doc().querySelector(`[${sel}="${c}"]`));assert(Math.abs(Number(line.getAttribute('x'+n))-(p.x-r.left)*1000/r.width)<2&&Math.abs(Number(line.getAttribute('y'+n))-(p.y-r.top)*1000/r.height)<2,'Line lost resized endpoint')}}}select.value='1920,1080';resize();await pause(50);log(label+' six viewport bounds, credit, RTL and target sizes')}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');const storage=frame.contentWindow.localStorage;saved=['little-learners-letters','little-learners-arabic'].map(k=>[k,storage.getItem(k)]);storage.setItem('little-learners-letters',JSON.stringify({letters:['A','B','C','S','T'],difficulty:'medium',sound:false,reach:true,arcadeAudio:{speech:false,effects:false,cheering:false}}));storage.setItem('little-learners-arabic',JSON.stringify({letters:['أ','ب','ت','ث','ج'],difficulty:'medium',narration:false,effects:false,celebrations:false,reach:true}));await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-categories'),'Hub missing');assert(!doc().querySelector('.site-bar'),'Hub still has top bar');const titles=[...doc().querySelectorAll('.ll-category h2')].map(n=>n.textContent);assert(titles.join('|')==='Shapes|English Letters|Numbers|Colors|الحروف العربية','Wrong category order');await menu('Directory',true);log('Directory has no bar, keeps top credit, Arabic last, five distinct card colors');
for(const id of ['shapes','letters','arabic']){doc().querySelector('.ll-art-'+id).closest('button').click();await wait(()=>doc().querySelector('.section-home'),'Section missing '+id);await menu(id,false);assert(doc().querySelector('.site-bar-title em'),'Two-tone section name missing');if(id==='letters'||id==='arabic'){if(id==='letters'){const card=[...doc().querySelectorAll('.ll-game-card')].find(c=>c.querySelector('h2').textContent==='Big & Small Matching');card.querySelector('button').click();}else doc().querySelector('.ar-art-matching').closest('article').querySelector('button').click();await wait(()=>doc().querySelector('.move-matching-board,.ar-connect-board'),'Matching missing');for(let round=0;round<4;round++){const arabic=id==='arabic',left=[...doc().querySelectorAll(arabic?'[data-letter]':'[aria-label^="Big "]')],right=[...doc().querySelectorAll(arabic?'[data-picture]':'[aria-label^="Small "]')];const chars=left.map(n=>arabic?n.dataset.letter:n.ariaLabel.slice(4));assert(left.length>1,'Not enough pairs');assert(right.every((n,i)=>(arabic?n.dataset.picture:n.ariaLabel.slice(6).toUpperCase())!==chars[i]),'Matching row aligned '+id);for(let j=0;j<left.length;j++){const target=right.find(n=>(arabic?n.dataset.picture:n.ariaLabel.slice(6).toUpperCase())===chars[j]);if(j%2){left[j].click();await pause(15);target.click();await pause(20);}else await drag(left[j],center(target));}assert(doc().querySelectorAll(arabic?'.ar-lines [data-pair]':'.move-permanent-line').length===left.length,'Correct matching lines missing');await wait(()=>round===3?doc().querySelector(arabic?'.ar-finale':'.move-finale'):!doc().querySelector(arabic?'.ar-celebration':'.move-reward'),'Matching did not advance');}log(id+' four matching sets: no aligned partners, real dragging and tap alternative');}button(id==='arabic'?'⌂ الرئيسية':'⌂ Home').click();await wait(()=>doc().querySelector('.ll-categories'),'Home missing');}status.textContent='All menu and shuffled matching checks passed';}catch(e){status.textContent='FAILED';report.textContent+='FAIL: '+e.message+'\n';console.error(e)}finally{if(saved)for(const[k,v]of saved){if(v===null)frame.contentWindow.localStorage.removeItem(k);else frame.contentWindow.localStorage.setItem(k,v);}run.disabled=false}};
async function menu(label,directory){for(const size of ['1920,1080','1366,768','1024,768','768,1024','844,390','390,844','320,568']){if(![...select.options].some(o=>o.value===size)){const o=new Option(size,size);select.add(o);}select.value=size;resize();await pause(100);const w=frame.contentWindow.innerWidth,grid=doc().querySelector(directory?'.ll-categories':'.adventure-grid'),cards=[...grid.children];assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+size+' '+[...doc().querySelectorAll('main,div,button,h1,h2,p,svg,span')].filter(n=>n.getBoundingClientRect().right>w+.5).slice(0,10).map(n=>n.className?.baseVal??n.className).join('|'));if(w>=768)assert(frame.contentWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length===3,label+' not three columns '+size);for(const card of cards){const r=card.getBoundingClientRect();assert(r.left>=-.5&&r.right<=w+.5,label+' card outside '+size);for(const child of card.querySelectorAll('h2,p,button,.ll-card-action,.ll-soon')){const c=child.getBoundingClientRect();assert(c.left>=r.left-.5&&c.right<=r.right+.5&&c.bottom<=r.bottom+.5,label+' content clipped '+size+' '+child.textContent);}const texts=[...card.children].filter(n=>n.matches('h2,p,small,button,.ll-card-action,.ll-soon,.ll-card-label')).map(n=>n.getBoundingClientRect());for(let i=0;i<texts.length;i++)for(let j=i+1;j<texts.length;j++){const a=texts[i],b=texts[j];assert(Math.min(a.right,b.right)-Math.max(a.left,b.left)<1||Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)<1,label+' text overlaps '+size);}}if(directory&&w>=768){assert(cards.every(c=>{const r=c.getBoundingClientRect();return Math.abs(r.width-r.height)<2;}),'Directory cards not square '+size);assert(new Set(cards.map(c=>frame.contentWindow.getComputedStyle(c).backgroundColor)).size===5,'Repeated directory colors');}assert(doc().querySelector('.site-credit').getBoundingClientRect().top<25,label+' top credit missing');}select.value='1920,1080';resize();await pause(70);log(label+' seven viewport grids, content bounds, no text overlap and top credit');}
</script></html>
