<!doctype html><html><meta charset="utf-8"><title>Colors arcade checks</title><style>body{margin:0;background:#eee8e2;font:14px system-ui}nav{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{border:0;transform-origin:top left;background:#fffaf1}#wrap{margin:12px}pre{padding:12px;white-space:pre-wrap;font-size:12px}</style><nav><button id="run">Run Colors arcade checks</button><select id="size"><option value="1920,1080">Smartboard 1920 × 1080</option><option value="1024,768">iPad landscape</option><option value="768,1024">iPad portrait</option><option value="844,390">Phone landscape</option><option value="390,844">Phone portrait</option><option value="320,568">Small phone</option></select><strong id="status">Ready</strong></nav><div id="wrap"><iframe title="Colors preview" src="/shape-land/"></iframe></div><pre id="report" role="status"></pre><script type="module">
import {COLORS,RECIPES,mixResult,SCENES,DIRTY_ZONES} from "/shape-land/src/colors/colorData.js";
const frame=document.querySelector('iframe'),wrap=document.querySelector('#wrap'),select=document.querySelector('#size'),status=document.querySelector('#status'),report=document.querySelector('#report'),run=document.querySelector('#run');const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,assert=(v,m)=>{if(!v)throw Error(m)},log=m=>report.textContent+='PASS: '+m+'\n';
function resize(){const[w,h]=select.value.split(',').map(Number),scale=Math.min((innerWidth-24)/w,(innerHeight-230)/h,1);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(wrap.style,{width:w*scale+'px',height:h*scale+'px'});}select.onchange=resize;window.onresize=resize;resize();
const button=(text,scope=doc())=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
async function wait(test,message,timeout=6000){const until=Date.now()+timeout;while(Date.now()<until){if(test())return;await pause(25)}throw Error(message)}
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};let pointer=200;
function emit(el,type,p,id,primary=true){el.dispatchEvent(new frame.contentWindow.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:p.x,clientY:p.y}));}
async function drag(el,to,cancel=false){const from=center(el),id=++pointer;emit(el,'pointerdown',from,id);for(let i=1;i<=10;i++){emit(el,'pointermove',{x:from.x+(to.x-from.x)*i/10,y:from.y+(to.y-from.y)*i/10},id);await pause(3)}emit(el,cancel?'pointercancel':'pointerup',to,id);await pause(25)}
const sizes=['1920,1080','1366,768','1024,768','820,1180','844,390','390,844','320,568'];
const buttonStarts=text=>[...doc().querySelectorAll('button')].find(b=>b.textContent.trim().startsWith(text));
const colorsByName=COLORS.slice().sort((a,b)=>b.name.length-a.name.length);
function targetColor(){const text=doc().querySelector('.co-instructions h1').textContent.toLowerCase();return colorsByName.find(c=>text.endsWith(c.name.toLowerCase()+'!')||text.includes('place '+c.name.toLowerCase()+' '))?.id;}
function progress(){return Number(doc().querySelector('[aria-label="Colors learning progress"]').getAttribute('aria-valuenow'));}
async function open(id){doc().querySelector('.co-menu-'+id).closest('article').querySelector('button').click();await wait(()=>doc().querySelector('.co-game'),'Game failed to open');await pause(100);}
async function back(){buttonStarts('Games');const b=[...doc().querySelectorAll('.site-bar button')].find(b=>b.textContent.includes('Games'));b.click();await wait(()=>doc().querySelector('.section-colors'),'Colors menu missing');}
async function choose(ids){buttonStarts('Choose colors')?.click();if(!doc().querySelector('.co-color-picker'))doc().querySelector('.site-bar button[aria-label="Teacher Settings"]').click();await wait(()=>doc().querySelector('.co-color-picker'),'Settings missing');button('Clear All').click();await pause(10);for(const id of ids){doc().querySelector(`.co-color-picker [aria-label="${COLORS.find(c=>c.id===id).name}"]`).click();await pause(5);}buttonStarts('Done').click();await pause(30);}
async function layouts(label){for(const value of sizes){if(![...select.options].some(o=>o.value===value))select.add(new Option(value,value));select.value=value;resize();await pause(110);const w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight;assert(doc().documentElement.scrollWidth<=w,label+' horizontal overflow '+value);assert(doc().documentElement.scrollHeight<=h,label+' gameplay scroll '+value);for(const node of doc().querySelectorAll('.site-bar button,.co-progress button,.co-bottle:not(.co-drag-ghost),.co-beaker,.co-lab-actions button,.co-toy:not(.co-drag-ghost),.co-sort-bin,.co-factory-top button,.co-palette-color,.co-paint-tools button,.co-wash-tools button,.co-wash-modes button,.co-bridge-slot,.co-bridge-piece:not(.co-drag-ghost),.co-scene-svg,.co-vehicle-svg')){const r=node.getBoundingClientRect();assert(r.left>=-.5&&r.top>=-.5&&r.right<=w+.5&&r.bottom<=h+.5,label+' outside '+value+' '+(node.ariaLabel||node.textContent)+' '+JSON.stringify({x:r.left,y:r.top,w:r.width,h:r.height}));if(!node.matches('svg'))assert(Math.min(r.width,r.height)>=33,label+' tiny control '+value+' '+node.ariaLabel);}}select.value='1920,1080';resize();await pause(70);log(label+' seven viewport bounds, full scene and no gameplay scroll');}
async function next(round,total){await wait(()=>round===total-1?doc().querySelector('.co-finale'):!doc().querySelector('.co-reward'),'Round did not advance',7000);await pause(120);}
function screen(svg,p){const a=svg.createSVGPoint();a.x=p.x;a.y=p.y;return a.matrixTransform(svg.getScreenCTM());}
async function svgGesture(svg,points,cancel=false){const id=++pointer;emit(svg,'pointerdown',screen(svg,points[0]),id);for(const p of points.slice(1)){emit(svg,'pointermove',screen(svg,p),id);await pause(3);}emit(svg,cancel?'pointercancel':'pointerup',screen(svg,points.at(-1)),id);await pause(30);}
async function tapSVG(svg,p){const id=++pointer;emit(svg,'pointerdown',screen(svg,p),id);emit(svg,'pointerup',screen(svg,p),id);await pause(25);}
function regionPoint(scene,region){const spec=SCENES.find(s=>s.id===scene).regions.find(r=>r.id===region),r=spec.hitRects?.[0]||spec.rect;return {x:r[0]+r[2]/2,y:r[1]+r[3]/2};}
run.onclick=async()=>{run.disabled=true;report.textContent='';status.textContent='Starting';let saved;try{
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload()});await wait(()=>doc().querySelector('.splash-enter'),'Splash missing');saved=frame.contentWindow.localStorage.getItem('little-learners-colors');frame.contentWindow.localStorage.setItem('little-learners-colors',JSON.stringify({colors:COLORS.map(c=>c.id),difficulty:'medium',voice:false,effects:false,cheering:false,reach:true,pauseMotion:false}));doc().querySelector('.splash-enter').click();await wait(()=>doc().querySelector('.ll-art-colors'),'Colors card missing');assert(!doc().querySelector('.ll-art-colors').closest('button').disabled,'Colors disabled');assert(doc().querySelectorAll('.ll-category').length===6&&doc().querySelectorAll('.ll-category:disabled').length===0,'Hub changed');doc().querySelector('.ll-art-colors').closest('button').click();await wait(()=>doc().querySelector('.section-colors'),'Menu missing');assert(doc().querySelectorAll('.co-menu-card').length===5,'Not five games');log('Colors activated; five themed games; all six categories active');
 status.textContent='Testing Magic Lab';await open('lab');await layouts('Color Lab');
 for(let round=0;round<5;round++){
  const name=doc().querySelector('.co-lab-target>b').textContent,target=COLORS.find(c=>c.name===name).id,beaker=doc().querySelector('.co-beaker'),bottles=[...doc().querySelectorAll('[data-bottle]')];
  if(!round){const first=bottles[0];await drag(first,{x:2,y:2});assert(progress()===0,'Outside pour scored');await drag(first,center(beaker),true);assert(progress()===0&&!doc().querySelector('.co-mixture-label'),'Cancelled pour accepted');let wrong;for(const a of bottles)for(const b of bottles)if(a!==b&&mixResult([a.dataset.bottle,b.dataset.bottle])!==target)wrong??=[a,b];assert(wrong,'No wrong recipe');await drag(wrong[0],center(beaker));await pause(600);await drag(wrong[1],center(beaker));assert(progress()===0,'Wrong recipe scored');assert(button('Try Again'),'No mixture reset');button('Try Again').click();await pause(30);log('Lab rejects outside/cancel/wrong recipes; Try Again empties mixture');}
  const recipe=RECIPES[target],first=doc().querySelector(`[data-bottle="${recipe[0]}"]`);await drag(first,center(beaker));await pause(600);const before=doc().querySelector('.co-lab-notebook').textContent;await drag(first,center(beaker));assert(doc().querySelector('.co-lab-notebook').textContent===before,'Duplicate pour accepted');doc().querySelector(`[data-bottle="${recipe[1]}"]`).click();await pause(10);beaker.click();await pause(25);assert(progress()===round+1,'Recipe failed '+target);assert(doc().querySelector('.co-mixture-label').textContent===name,'Wrong result');await next(round,5);
 }log('Lab five correct recipe rounds, real pours, tap option and duplicate protection');await back();
 status.textContent='Testing Factory';await open('factory');await layouts('Factory with five bins and ten toys');let first=doc().querySelector('[data-toy]'),start=center(first);await pause(1400);assert(Math.hypot(center(first).x-start.x,center(first).y-start.y)>2,'Stationary toys');buttonStarts('Pause motion')||null;const motion=doc().querySelector('.co-factory-top button');motion.click();await pause(35);const frozen=center(first);await pause(250);assert(Math.hypot(center(first).x-frozen.x,center(first).y-frozen.y)<.5,'Pause failed');motion.click();await pause(50);
 for(let round=0;round<3;round++){
  const toys=()=>[...doc().querySelectorAll('[data-toy]')];if(!round){const toy=toys()[0],wrong=[...doc().querySelectorAll('[data-bin]')].find(b=>b.dataset.bin!==toy.dataset.color);await drag(toy,center(wrong));assert(progress()===0,'Wrong bin scored');await pause(300);await drag(toy,{x:2,y:2});await pause(300);await drag(toy,center(doc().querySelector(`[data-bin="${toy.dataset.color}"]`)),true);assert(doc().querySelectorAll('[data-toy]').length===10,'Outside/cancel counted');log('Factory movement, pause/resume and wrong/outside/cancel sorting');}
  let i=0;while(toys().length){const toy=toys()[0],bin=doc().querySelector(`[data-bin="${toy.dataset.color}"]`);if(i++%2){toy.click();await pause(30);const held=center(toy);await pause(120);assert(Math.hypot(center(toy).x-held.x,center(toy).y-held.y)<.5,'Tap selection did not freeze belt');bin.click();await pause(30);}else await drag(toy,center(bin));}assert(progress()===round+1,'Factory incomplete');assert(doc().querySelector('.co-factory-prize'),'No factory prize');await next(round,3);
 }log('Factory three complete ten-toy sets, matching bins, drag/tap and prize');await back();
 status.textContent='Testing Painting';await open('paint');await layouts('Painting with six-color palette');
 for(let round=0;round<3;round++){
  const scene=SCENES[round].id,svg=doc().querySelector('.co-scene-svg');if(!round){const region=doc().querySelector('.co-current-region').dataset.region,p=regionPoint(scene,region),target=targetColor(),wrong=[...doc().querySelectorAll('[data-paint]')].find(b=>b.dataset.paint!==target);wrong.click();await pause(10);await tapSVG(svg,p);assert(!doc().querySelector('.co-painted-region'),'Wrong color scored');doc().querySelector(`[data-paint="${target}"]`).click();await pause(10);const other=SCENES[round].regions.find(r=>r.id!==region).id;await tapSVG(svg,regionPoint(scene,other));assert(!doc().querySelector('.co-painted-region'),'Wrong region scored');await svgGesture(svg,[{x:p.x-15,y:p.y},p],true);assert(!doc().querySelector('.co-painted-region'),'Cancelled brush scored');await tapSVG(svg,p);assert(doc().querySelectorAll('.co-painted-region').length===1,'Correct paint failed');buttonStarts('Reset Scene').click();await pause(25);assert(!doc().querySelector('.co-painted-region'),'Reset failed');log('Painting checks both color and region; cancel/reset preserve progress');}
  for(let step=0;step<4;step++){const region=doc().querySelector('.co-current-region').dataset.region,p=regionPoint(scene,region),target=targetColor();assert(target,'No color instruction');doc().querySelector(`[data-paint="${target}"]`).click();await pause(10);if(step%2)await tapSVG(svg,p);else await svgGesture(svg,[{x:p.x-18,y:p.y},p]);assert(doc().querySelectorAll('.co-painted-region').length===step+1,'Region unpainted');}assert(progress()===round+1,'Scene incomplete');await next(round,3);
 }log('Three fully colored SVG scenes: twelve region/color tasks using brush and tap');await back();
 status.textContent='Testing Car Wash';await open('wash');await layouts('Car wash scrub phase');
 for(let round=0;round<3;round++){
  const svg=doc().querySelector('.co-vehicle-svg'),coverage=()=>Number(doc().querySelector('[aria-label="Cleaning coverage"]').getAttribute('aria-valuenow'));
  if(!round){await tapSVG(svg,{x:400,y:205});assert(coverage()===0,'One tap washed car');await svgGesture(svg,[{x:100,y:205},{x:700,y:205}]);assert(coverage()===0,'Teleport washed car');await svgGesture(svg,Array.from({length:31},(_,i)=>({x:100+i*20,y:205})),true);assert(coverage()===0,'Cancelled scrub counted');}
  if(round===1){buttonStarts('Tap dirty spots').click();await pause(20);for(const zone of DIRTY_ZONES){await tapSVG(svg,zone);assert(!doc().querySelector('.co-palette'),'One tap per spot completed wash');await tapSVG(svg,zone);}}
  else{await svgGesture(svg,Array.from({length:31},(_,i)=>({x:100+i*20,y:205})));assert(coverage()>0&&coverage()<100,'First stroke should partly clean');await svgGesture(svg,Array.from({length:31},(_,i)=>({x:100+i*20,y:300})));}
  assert(doc().querySelector('.co-palette'),'Wash did not unlock painting');assert(progress()===round,'Wash alone scored');if(!round)await layouts('Car wash paint phase');const target=targetColor();assert(target,'No paint target');const wrong=[...doc().querySelectorAll('[data-paint]')].find(b=>b.dataset.paint!==target);if(wrong){wrong.click();await pause(10);await tapSVG(svg,{x:400,y:250});assert(progress()===round,'Wrong car paint scored');}doc().querySelector(`[data-paint="${target}"]`).click();await pause(10);await svgGesture(svg,[{x:380,y:260},{x:410,y:260}]);assert(progress()===round+1,'Car paint incomplete');assert(doc().querySelector('.co-car-party'),'Car did not drive away');await next(round,3);
 }log('Three vehicles: real scrub coverage, twelve-tap alternative, correct paint and drive-away');await back();
 status.textContent='Testing Bridge';await open('bridge');await layouts('Rainbow bridge');
 for(let round=0;round<3;round++){
  assert(doc().querySelector('.co-bridge-note').textContent.includes('Six-color'),'Canonical rainbow missing');if(!round){const wrong=doc().querySelector('[data-bridge-piece][data-color="blue"]'),slot=doc().querySelector('.co-bridge-slot');await drag(wrong,center(slot));assert(progress()===0,'Wrong bridge piece scored');await pause(300);await drag(doc().querySelector('[data-bridge-piece][data-color="red"]'),center(slot),true);assert(doc().querySelector('.co-bridge-slot').textContent.includes('0 / 6'),'Cancelled piece placed');}
  for(const [i,id] of ['red','orange','yellow','green','blue','purple'].entries()){const piece=doc().querySelector(`[data-bridge-piece][data-color="${id}"]`),slot=doc().querySelector('.co-bridge-slot');if(i%2){piece.click();await pause(10);slot.click();await pause(25);}else await drag(piece,center(slot));}assert(progress()===round+1,'Bridge incomplete');assert(doc().querySelector('.co-cross-arch'),'Friend did not cross');await next(round,3);
 }log('Three six-color bridges: ordered construction, drag/tap, wrong/cancel and crossing');await back();
 await choose(['brown']);assert(doc().querySelector('.co-menu-lab').closest('article').querySelector('button').disabled,'Unsupported recipe enabled');await open('bridge');assert(doc().querySelector('.co-bridge-note').textContent.includes('practice'),'Subset not labeled practice');assert([...doc().querySelectorAll('[data-bridge-piece]')].every(e=>e.dataset.color==='brown'),'Subset overridden');await back();await open('factory');assert(doc().querySelectorAll('[data-bin]').length===1,'Single-color bins wrong');await back();await choose([]);assert([...doc().querySelectorAll('.co-menu-card button')].every(b=>b.disabled),'Empty selection enabled games');await choose(['green']);await open('lab');assert(doc().querySelector('[data-bottle="blue"]')&&doc().querySelector('[data-bottle="yellow"]'),'Ingredients not supplied');doc().querySelector('[aria-label="Teacher Settings"]').click();await wait(()=>buttonStarts('Apply & Restart'),'Restart missing');buttonStarts('Apply & Restart').click();await pause(100);assert(progress()===0,'Restart did not reset');log('Teacher subsets, empty selection, unsupported recipes and restart');status.textContent='All Colors arcade checks passed';
 }catch(error){status.textContent='FAILED';report.textContent+='FAIL: '+(error.stack||String(error));console.error(error);}finally{if(saved!==undefined){if(saved===null)frame.contentWindow.localStorage.removeItem('little-learners-colors');else frame.contentWindow.localStorage.setItem('little-learners-colors',saved);}run.disabled=false;}
};
</script></html>
